<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>多智能体管家 · 多Agent 编排控制台</title>
<link rel="stylesheet" href="/katex/katex.min.css" />
<script src="/katex/katex.min.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:oklch(97.5% .004 262);--bg-2:oklch(94.5% .006 262);
  --panel:oklch(96% .005 262);--panel-2:oklch(92.5% .007 262);
  --card:oklch(100% 0 0);--card-hover:oklch(95.5% .006 262);
  --border:oklch(89% .009 262);--border-strong:oklch(79% .012 262);
  --fg:oklch(19% .025 262);--fg-2:oklch(34% .018 262);
  --muted:oklch(52% .012 262);--muted-2:oklch(62% .011 262);
  --accent:oklch(52% .11 178);--accent-soft:oklch(52% .11 178/.12);--accent-strong:oklch(45% .12 176);
  --success:oklch(47% .11 152);--success-soft:oklch(47% .11 152/.12);
  --warning:oklch(56% .12 85);--warning-soft:oklch(56% .12 85/.14);
  --danger:oklch(52% .16 22);--danger-soft:oklch(52% .16 22/.12);
  --violet:oklch(50% .13 296);--violet-soft:oklch(50% .13 296/.12);
  --blue:oklch(50% .12 250);--blue-soft:oklch(50% .12 250/.12);
  --green:oklch(47% .11 158);--green-soft:oklch(47% .11 158/.12);
  --red:oklch(52% .16 22);--red-soft:oklch(52% .16 22/.12);
  --shadow-sm:0 1px 2px oklch(0% 0 0/.05);
  --shadow-md:0 8px 24px -8px oklch(0% 0 0/.12);
  --shadow-lg:0 24px 60px -16px oklch(0% 0 0/.18);
  --radius:8px;--radius-lg:12px;
  --sans:'Segoe UI Variable Text','Segoe UI','Microsoft YaHei UI','PingFang SC',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  --heading:'Segoe UI Variable Display','Segoe UI','Microsoft YaHei UI',sans-serif;
  --mono:'Cascadia Code',ui-monospace,SFMono-Regular,Consolas,monospace;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden}
body{font:14px/1.6 var(--sans);font-weight:500;color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;font:inherit;border:none;background:none;color:inherit}
input,textarea,select{font:inherit;color:inherit}

/* ── Layout ── */
.app{display:grid;grid-template-columns:190px 1fr 300px;grid-template-rows:48px 1fr;height:100vh;min-width:940px;overflow-x:auto}
.app--no-config{grid-template-columns:190px 1fr 0px}
.topbar{grid-column:1/-1;background:var(--bg-2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:10}
.topbar__brand{font-family:var(--heading);font-weight:700;font-size:15px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.topbar__logo{width:22px;height:22px;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 1px 2px oklch(0% 0 0/.18))}
.topbar__sep{width:1px;height:20px;background:var(--border)}
.topbar__title{font-family:var(--heading);font-size:13px;font-weight:500;color:var(--fg-2)}
.topbar__spacer{flex:1}
.topbar__status{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.topbar__dot{width:6px;height:6px;border-radius:50%;background:var(--muted-2)}
.topbar__dot--live{background:var(--success);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.topbar__preset{display:flex;align-items:center;gap:6px}
.topbar__preset select{height:28px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);padding:0 8px;font-size:12px;outline:none;cursor:pointer}
.topbar__preset select:focus{border-color:var(--accent)}
.topbar__btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-2);color:var(--fg-2);font-size:12px;transition:all .18s ease}
.topbar__btn:hover{background:var(--panel);color:var(--fg);border-color:var(--border-strong)}
.topbar__btn--accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.topbar__btn--accent:hover{background:oklch(68% .16 38/.25)}
.topbar__btn--danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.topbar__btn--danger:hover{background:oklch(66% .18 25/.25)}
.topbar__btn--success{background:var(--success-soft);color:var(--success);border-color:transparent}
@keyframes exec-pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 6px transparent}}
#btn-execute.exec-pulse{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);animation:exec-pulse 1.4s ease-in-out infinite}
.topbar__btn svg{width:14px;height:14px}

/* ── Sidebar nav ── */
.sidebar{grid-row:2;background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:stretch;padding:10px 8px;gap:4px;overflow:hidden}
.nav-btn{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;height:38px;padding:0 10px;border-radius:var(--radius);color:var(--muted-2);transition:all .18s ease;position:relative}
.nav-btn__label{font-size:12.5px;font-weight:500;color:inherit;white-space:nowrap}
.nav-btn:hover{background:var(--panel);color:var(--fg-2)}
.nav-btn--active{background:var(--accent-soft);color:var(--accent)}
.nav-btn svg{width:18px;height:18px}
.nav-btn__badge{position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent);border:2px solid var(--bg-2)}

.sidebar__history{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--border);margin-top:8px;padding-top:8px;overflow:hidden}
.sidebar__history-title{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0 8px 6px;font-weight:600}
.sidebar__history .history__list{flex:1;overflow-y:auto;padding:4px 2px;display:flex;flex-direction:column;gap:6px}

/* ── Main area ── */
.main{grid-column:2;overflow:hidden;position:relative}
.panel{display:none;height:100%;overflow:hidden}
.panel--active{display:flex;flex-direction:column;animation:panel-in .22s ease}
@keyframes panel-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── Config panel (right) ── */
.config{grid-column:3;background:var(--bg-2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.config--hidden{display:none}
.config__head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.config__head-title{font-family:var(--heading);font-weight:600;font-size:13px;flex:1}
.config__close{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;color:var(--muted-2);transition:all .15s}
.config__close:hover{background:var(--card-hover);color:var(--fg)}
.config__body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.config__empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--muted-2);font-size:13px;text-align:center;padding:20px}
.config__empty svg{width:32px;height:32px;opacity:.4}

/* form fields */
.field{display:flex;flex-direction:column;gap:5px}
.field__label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.field__input{height:32px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);padding:0 10px;font-size:13px;outline:none;transition:border-color .18s ease}
.field__input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.field__textarea{min-height:72px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);padding:8px 10px;font-size:13px;outline:none;resize:vertical;transition:border-color .18s ease}
.field__textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.field__select{height:32px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--fg);padding:0 10px;font-size:13px;outline:none;cursor:pointer;transition:border-color .18s ease}
.field__select:focus{border-color:var(--accent)}

/* ── Chat panel ── */
.chat{display:flex;flex-direction:column;height:100%}
.chat__messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.chat__welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted-2)}
.chat__welcome>svg{width:40px;height:40px;opacity:.3}
.chat__welcome-title{font-family:var(--heading);font-size:16px;font-weight:600;color:var(--fg-2)}
.chat__welcome-desc{font-size:13px;text-align:center;max-width:320px}
.chat-bubble{max-width:1080px;animation:msg-in .25s ease}
@keyframes msg-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.chat-bubble--user{width:max-content;max-width:78%;margin-left:auto;align-self:flex-end}
.chat-bubble--ai{width:100%}
.chat-bubble__inner{padding:10px 14px;border-radius:var(--radius-lg);font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.chat-bubble__inner{font-size:14.5px;line-height:1.75}
.chat-bubble--user .chat-bubble__inner{background:var(--accent-soft);color:var(--fg);border:1px solid oklch(68% .16 38/.2)}
.chat-bubble--ai .chat-bubble__inner{background:transparent;border:none;color:var(--fg);padding:6px 2px}
.chat-bubble__inner h2,.chat-bubble__inner h3,.chat-bubble__inner h4{margin:8px 0 4px;font-weight:700;line-height:1.35}
.chat-bubble__inner h2{font-size:15px}.chat-bubble__inner h3{font-size:14px}.chat-bubble__inner h4{font-size:13.5px}
.chat-bubble__inner p{margin:4px 0}
.chat-bubble__inner ul,.chat-bubble__inner ol{margin:4px 0;padding-left:22px}
.chat-bubble__inner li{margin:2px 0}
.chat-bubble__inner code{background:var(--bg-2);border:1px solid var(--border);border-radius:4px;padding:1px 4px;font-size:12px}
.chat-bubble__inner pre{margin:6px 0;padding:8px 10px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;overflow:auto;font-size:12px;line-height:1.5}
.chat-bubble__inner pre code{border:none;background:none;padding:0}
.chat-bubble__inner a{color:var(--accent)}
.chat-bubble__inner blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid var(--accent);background:var(--bg-2);border-radius:0 6px 6px 0;color:var(--muted)}
.chat-bubble__inner .math-block{margin:8px 0;padding:8px 10px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;overflow-x:auto;text-align:center}
.chat-bubble__inner .math-block .katex{font-size:1.05em}
.chat-bubble__inner .katex{font-size:1.02em}
.chat-bubble__inner table{border-collapse:collapse;margin:6px 0;font-size:13px;width:100%}
.chat-bubble__inner th,.chat-bubble__inner td{border:1px solid var(--border);padding:5px 9px;text-align:left}
.chat-bubble__inner th{background:var(--bg-2);font-weight:600}
.chat-bubble__meta{font-family:var(--mono);font-size:10px;color:var(--muted-2);margin-top:4px;padding:0 4px}
.chat-bubble--user .chat-bubble__meta{text-align:right}
.chat__input-bar{border-top:1px solid var(--border);padding:10px 16px;display:flex;gap:8px;background:var(--bg)}
.chat__opts{display:flex;align-items:center;justify-content:flex-end;gap:6px;padding:8px 16px 0;flex-wrap:wrap;background:var(--bg)}
.chat__opt-label{font-size:10.5px;color:var(--muted-2);font-family:var(--mono)}
.chat__opt{border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--fg-2);font-size:11px;padding:2px 6px;max-width:180px;outline:none;transition:border-color .15s}
.chat__opt:hover{border-color:var(--border-strong)}
.chat__input{flex:1;min-height:46px;max-height:160px;border:1px solid var(--border-strong);border-radius:10px;background:var(--card);padding:8px 12px;font-size:13px;line-height:1.5;resize:none;overflow-y:auto;outline:none;transition:border-color .18s ease,box-shadow .18s ease;box-shadow:0 2px 6px oklch(0% 0 0/.05),0 1px 2px oklch(0% 0 0/.04)}
.chat__input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),0 6px 20px -6px oklch(0% 0 0/.18)}
.chat__input::placeholder{color:var(--muted-2)}
.chat__send{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:var(--radius);background:var(--accent);color:oklch(99% 0 0);transition:background .18s ease,transform .15s}
.chat__send:hover{transform:scale(1.05)}
.chat__send:disabled{background:var(--panel-2);color:var(--muted);cursor:default;transform:none}
.chat__send svg{width:16px;height:16px}
.topbar__sub{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:400}
.hero__title{font-family:var(--heading);font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--fg);text-align:center;line-height:1.3}
.hero__sub{font-size:13px;color:var(--muted-2);text-align:center;width:min(640px,92%);line-height:1.65}
.hero__box{position:relative;width:min(640px,92%);margin-top:8px}
.hero__input{display:block;width:100%;min-height:56px;resize:none;border:1px solid var(--border-strong);border-radius:14px;background:var(--card);padding:12px 58px 12px 14px;font:13px/1.6 var(--fg);color:var(--fg);outline:none;transition:border-color .18s,box-shadow .18s;box-shadow:0 2px 6px oklch(0% 0 0/.05),0 1px 2px oklch(0% 0 0/.04)}
.hero__input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),0 8px 24px -8px oklch(0% 0 0/.2)}
.hero__input::placeholder{color:var(--muted-2)}
.hero__send{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:none;border-radius:10px;background:var(--accent-strong);color:oklch(99% 0 0);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s cubic-bezier(.16,1,.3,1),background .18s,box-shadow .2s}
.hero__send svg{width:16px;height:16px;opacity:1}
.hero__send:hover{background:var(--accent);box-shadow:0 8px 20px -8px var(--accent-soft)}
.hero__send:active{transform:translateY(-50%) scale(.97)}
.hero__send:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
.hero__send.is-loading svg{animation:hero-spin 1s linear infinite}
@keyframes hero-spin{to{transform:rotate(360deg)}}
.hero__chip:active{transform:scale(.97)}
.run-dash{border:1px solid var(--accent-soft);border-radius:var(--radius-lg);background:linear-gradient(180deg,var(--panel),var(--bg-2));margin:12px 16px 0;padding:12px 14px;font-size:13px}
.config .run-dash{margin:12px 12px 0;flex-shrink:0;max-height:min(55vh,440px);overflow-y:auto;min-height:0}
.run-dash__head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.run-dash__badge{font-family:var(--mono);font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);animation:exec-pulse 1.4s ease-in-out infinite}
.run-dash__badge--done{background:var(--success-soft);color:var(--success);animation:none}
.run-dash__badge--err{background:var(--danger-soft);color:var(--danger);animation:none}
.run-dash__title{font-weight:600;color:var(--fg)}
.run-dash__spacer{flex:1}
.run-dash__btn{border:1px solid var(--border);border-radius:6px;background:var(--bg-2);color:var(--fg-2);font-size:11px;padding:3px 10px;transition:all .15s}
.run-dash__sel{border:1px solid var(--border);border-radius:6px;background:var(--bg-2);color:var(--fg-2);font-size:10.5px;padding:2px 4px;max-width:160px;outline:none;transition:border-color .15s}
.run-dash__sel:hover{border-color:var(--border-strong)}
.run-dash__btn:hover{border-color:var(--border-strong);color:var(--fg)}
.run-dash__btn--danger:hover{border-color:var(--danger);color:var(--danger)}
.run-dash__iter{font-family:var(--mono);font-size:11.5px;color:var(--muted-2);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-dash__nodes{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow-y:auto}
.rd-node{display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:border-color .15s,box-shadow .15s}
.rd-node:hover{border-color:var(--accent);box-shadow:0 2px 10px -4px var(--accent-soft)}
.rd-node__dot{width:8px;height:8px;border-radius:50%;background:var(--muted-2);flex-shrink:0}
.rd-node__dot--running{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.rd-node__dot--done{background:var(--success)}
.rd-node__dot--failed{background:var(--danger)}
.rd-node__name{font-weight:600;color:var(--fg);font-size:13px}
.rd-node__type{font-size:11px;color:var(--muted-2)}
.rd-node__out{flex:1;font-family:var(--mono);font-size:12px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;max-width:55%}
.rd-review{margin-top:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:12px;line-height:1.55}
.rd-review__head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.rd-review__tag{font-weight:700;font-size:12px;padding:2px 9px;border-radius:999px}
.rd-review--pass .rd-review__tag{background:var(--success-soft);color:var(--success)}
.rd-review--revise .rd-review__tag{background:var(--warning-soft);color:var(--warning)}
.rd-review--blocked .rd-review__tag{background:var(--danger-soft);color:var(--danger)}
.rd-review__conf{font-family:var(--mono);font-size:10px;color:var(--muted-2)}
.rd-review__summary{color:var(--fg-2)}
.rd-review__changes{color:var(--warning);margin-top:4px}
.rd-review__next{color:var(--accent);margin-top:4px}
.rd-analysis{margin-top:8px;padding:10px 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg-2);font-size:12px;line-height:1.6}
.rd-analysis__head{font-weight:700;color:var(--fg);margin-bottom:6px}
.rd-analysis__loading{color:var(--muted-2)}
.rd-analysis__summary{color:var(--fg);font-size:12.5px;font-weight:600;margin-bottom:4px}
.rd-analysis__progress{color:var(--fg-2);white-space:pre-wrap}
.rd-analysis__blocking{color:var(--warning);margin-top:4px}
.rd-analysis__sugg{color:var(--accent);margin-top:4px}
.hero__chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.hero__chip{padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:var(--card);color:var(--fg-2);font-size:12px;cursor:pointer;transition:all .15s}
.hero__chip:hover{border-color:var(--accent);color:var(--accent)}
.cursor{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:text-bottom;margin-left:2px;animation:blink 1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}

/* ── Pipeline editor ── */
.pipeline{display:flex;flex-direction:column;height:100%;overflow:hidden}
.pipeline__toolbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--bg-2);flex-wrap:wrap}
.pipeline__toolbar .sep{width:1px;height:18px;background:var(--border)}
.pipe-btn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-2);color:var(--fg-2);font-size:12px;transition:all .18s ease}
.pipe-btn:hover{background:var(--panel);color:var(--fg);border-color:var(--border-strong)}
.pipe-btn--accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pipe-btn--accent:hover{background:oklch(68% .16 38/.25)}
.pipe-btn--danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.pipe-btn svg{width:13px;height:13px}
.pipeline__canvas-wrap{flex:1;overflow:auto;position:relative;background:var(--bg);background-image:radial-gradient(circle,oklch(30% .008 275/.4) 1px,transparent 1px);background-size:24px 24px}
.pipeline__canvas{position:relative;width:3000px;height:2000px}
.pipeline__svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.pipeline__svg path{fill:none;stroke:var(--border-strong);stroke-width:2;pointer-events:stroke;cursor:pointer}
.pipeline__svg path:hover{stroke:var(--accent);stroke-width:2.5}
.pipeline__svg path.edge--active{stroke:var(--accent);stroke-width:2.5}
.pipeline__svg .flow-dot{fill:var(--accent);r:3}
.pipeline__svg .arrowhead{fill:var(--border-strong)}
.pipeline__svg .loop-boundary{fill:color-mix(in srgb,var(--accent) 5%,transparent);stroke:var(--accent);stroke-width:1.5;stroke-dasharray:8 6;pointer-events:none}
.pipeline__svg .loopback{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:7 5;opacity:.9;pointer-events:none}
.pipeline__svg .loop-label{fill:var(--accent);font-size:12px;font-weight:600;pointer-events:none}
.pipeline__svg .loop-arrowhead{fill:var(--accent)}

/* node cards */
.node{position:absolute;z-index:2;width:180px;background:var(--card);border:2px solid var(--border);border-radius:var(--radius-lg);cursor:grab;transition:box-shadow .18s ease,border-color .18s ease;user-select:none}
.node:hover{box-shadow:var(--shadow-md)}
.node--selected{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.node--architect{border-left:3px solid var(--blue)}
.node--reviewer{border-left:3px solid var(--green)}
.node--executor{border-left:3px solid var(--red)}
.node--running{animation:node-pulse 1.5s ease-in-out infinite}
@keyframes node-pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-soft)}50%{box-shadow:0 0 0 8px transparent}}
.node--done{border-color:var(--success)}
.node--failed{border-color:var(--danger)}
.node--interrupted{border-color:var(--warning, #d97706)}
.node__head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border)}
.node__type-badge{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:999px;font-family:var(--mono);font-size:10px;font-weight:600;white-space:nowrap}
.node__type-badge--architect{background:var(--blue-soft);color:var(--blue)}
.node__type-badge--reviewer{background:var(--green-soft);color:var(--green)}
.node__type-badge--executor{background:var(--red-soft);color:var(--red)}
.node__name{font-weight:600;font-size:12px;color:var(--fg);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node__status{width:8px;height:8px;border-radius:50%;background:var(--muted-2);flex-shrink:0}
.node__status--idle{background:var(--muted-2)}
.node__status--running{background:var(--accent);animation:pulse 1s ease-in-out infinite}
.node__status--done{background:var(--success)}
.node__status--failed{background:var(--danger)}
.node__status--interrupted{background:var(--warning, #d97706)}
.node__output{font-size:10px;color:var(--muted-2);line-height:1.35;margin-top:3px;word-break:break-all;max-height:38px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rc-events details.rc-ev{border-bottom:1px solid rgba(15,23,42,.07)}
.rc-events details.rc-ev summary{cursor:pointer;padding:5px 4px;list-style:none;display:flex;gap:6px;align-items:baseline;user-select:none}
.rc-events details.rc-ev summary::-webkit-details-marker{display:none}
.rc-events details.rc-ev summary::before{content:"▸";color:#8c959f;font-size:10px;flex-shrink:0}
.rc-events details.rc-ev[open] summary::before{content:"▾"}
.rc-events details.rc-ev pre{margin:0 4px 6px 18px;white-space:pre-wrap;color:#57606a;font:11px/1.5 var(--mono);max-height:200px;overflow:auto;background:rgba(15,23,42,.04);padding:6px;border-radius:4px}
.rc-send--confirm{background:var(--danger-soft)!important;color:var(--danger)!important;border-color:var(--danger)!important}
.node__detail-btn{cursor:pointer;font-size:11px;color:var(--muted-2);margin-left:4px;opacity:0.6;transition:opacity .15s}
.node:hover .node__detail-btn{opacity:1}
.node__detail-btn:hover{color:var(--accent)}
.node__body{padding:6px 10px 8px;font-size:11px;color:var(--muted)}
.node__model{font-family:var(--mono);font-size:10.5px;color:var(--fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node__skill{font-size:10.5px;color:var(--muted-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* port circles for edge dragging */
.node__port{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--panel-2);border:2px solid var(--border-strong);z-index:3;cursor:crosshair;transition:all .15s ease}
.node__port-badge{position:absolute;top:-8px;right:-8px;background:var(--accent);color:#fff;font-size:9px;padding:1px 5px;border-radius:4px;cursor:pointer;z-index:10;font-family:var(--mono);white-space:nowrap;transition:opacity .15s}
.node__port-badge:hover{opacity:.8}
.node__port-badge--idle{background:#e6a800}
.node__port-badge--stopped{background:var(--muted-2);cursor:default}
.node__port:hover{background:var(--accent);border-color:var(--accent);transform:scale(1.3)}
.node__port--out{right:-7px;top:50%;margin-top:-6px}
.node__port--in{left:-7px;top:50%;margin-top:-6px}

/* edge label */
.edge-label{position:absolute;z-index:2;font-family:var(--mono);font-size:10px;color:var(--muted-2);background:var(--bg-2);padding:1px 6px;border-radius:4px;border:1px solid var(--border);pointer-events:none}

/* ── Stats / Dashboard ── */
.stats{overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.stats__overview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats__card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;transition:border-color .18s ease}
.stats__card:hover{border-color:var(--border-strong)}
.stats__card-label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.stats__card-value{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--fg);margin-top:4px}
.stats__card-value.acc{color:var(--accent)}
.stats__card-value.ok{color:var(--success)}
.stats__card-unit{font-size:11px;color:var(--muted);font-weight:400;margin-left:2px}
.stats__section-title{font-family:var(--heading);font-size:14px;font-weight:600;color:var(--fg)}
.stats__table{width:100%;border-collapse:collapse;font-size:12.5px}
.stats__table th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stats__table td{padding:8px 10px;border-bottom:1px solid oklch(30% .008 275/.3);color:var(--fg-2)}
.stats__table tr:hover td{background:var(--card-hover)}
.stats__table .mono{font-family:var(--mono)}

/* ── Data panel ── */
.data-panel{overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:16px}
.runs-list{display:flex;flex-direction:column;gap:8px}
.run-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;transition:all .18s ease}
.run-card:hover{border-color:var(--border-strong);background:var(--card-hover)}
.run-card__head{display:flex;align-items:center;gap:8px}
.run-card__id{font-family:var(--mono);font-size:12px;color:var(--accent)}
.run-card__status{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:10.5px;font-weight:500}
.run-card__status--running{background:var(--accent-soft);color:var(--accent)}
.run-card__status--completed{background:var(--success-soft);color:var(--success)}
.run-card__status--failed{background:var(--danger-soft);color:var(--danger)}
.run-card__status--cancelled{background:var(--warning-soft);color:var(--warning)}
.run-card__meta{font-family:var(--mono);font-size:10.5px;color:var(--muted-2);margin-top:4px}
.run-card__spacer{flex:1}
.run-card__actions{display:flex;gap:4px}
.run-card__btn{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--bg-2);color:var(--muted);transition:all .15s}
.run-card__btn:hover{background:var(--panel);color:var(--fg)}

/* ── History panel ── */
.history{height:100%;display:flex;flex-direction:column;overflow:hidden}
.history__header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg-2)}
.history__list{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.history__back{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--accent);cursor:pointer;padding:4px 8px;border-radius:6px;transition:background .15s}
.history__back:hover{background:var(--accent-soft)}
.session-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;cursor:pointer;transition:all .18s ease;display:flex;align-items:center;gap:10px}
.session-card:hover{border-color:var(--border-strong);background:var(--card-hover)}
.session-card--current{border-color:var(--accent)}
.session-card__info{flex:1;min-width:0}
.session-card__name{font-family:var(--mono);font-size:11px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-card__title{font-size:13px;color:var(--fg);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.session-card__meta{font-family:var(--mono);font-size:10px;color:var(--muted-2);margin-top:2px}
.session-card__actions{display:flex;gap:4px;flex-shrink:0}
.session-card__btn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--bg-2);color:var(--muted);transition:all .15s}
.session-card__btn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.session-card__btn--danger:hover{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.history-msg{padding:8px 12px;border-radius:var(--radius-lg);font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;animation:msg-in .2s ease}
.history-msg--user{background:var(--accent-soft);color:var(--fg);border:1px solid oklch(68% .16 38/.2);align-self:flex-end;width:max-content;max-width:80%}
.history-msg--assistant{background:transparent;color:var(--fg);border:none;align-self:stretch;width:100%;max-width:none;padding:6px 2px}
.history-msg--tool{background:var(--bg-2);color:var(--muted);border:1px solid var(--border);font-family:var(--mono);font-size:11px;align-self:flex-start;max-width:90%;padding:6px 10px}
.history-msg__role{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px;font-weight:600}
.history-msg--user .history-msg__role{color:var(--accent)}
.history-msg--assistant .history-msg__role{color:var(--success)}
.history-msg__tool{font-family:var(--mono);font-size:11px;color:var(--muted-2);margin-top:4px}
.history-empty{text-align:center;color:var(--muted-2);padding:40px 20px;font-size:13px}

/* ── Toast ── */
.toast{position:fixed;bottom:20px;right:20px;z-index:999;padding:10px 16px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--border-strong);color:var(--fg);font-size:13px;box-shadow:var(--shadow-lg);animation:toast-in .3s ease;display:flex;align-items:center;gap:8px;max-width:360px}
@keyframes toast-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast--success{border-color:var(--success);background:var(--success-soft);color:var(--success)}
.toast--error{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}

/* ── Modal overlay ── */
.modal-overlay{position:fixed;inset:0;background:oklch(0% 0 0/.55);display:flex;align-items:center;justify-content:center;z-index:100;animation:fade-in .18s ease}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel);border:1px solid var(--border-strong);border-radius:var(--radius-lg);width:min(520px,90vw);max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal{animation:modal-in .22s cubic-bezier(.16,1,.3,1)}
@keyframes modal-in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.modal__head{padding:14px 16px;border-bottom:1px solid var(--border);font-family:var(--heading);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.modal__close{margin-left:auto;cursor:pointer;color:var(--muted-2);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:background .15s}
.modal__close:hover{background:var(--card-hover);color:var(--fg)}
.modal__body{padding:14px 16px}
.modal__foot{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* Draggable + resizable window-style modals (node detail, runtime console,
   self-check). resize:both gives the native bottom-right resize handle;
   dragging is handled in JS on .modal__head--drag. */
.modal--win{display:flex;flex-direction:column;resize:both;overflow:hidden;min-width:480px;min-height:300px}
.modal--win .modal__body{flex:1;min-height:0;overflow-y:auto}
.modal--win .modal__head--drag{cursor:move;user-select:none}
.modal--win .modal__head--drag:active{cursor:grabbing}

/* ── Animations for data flow ── */
@keyframes flow{0%{stroke-dashoffset:20}100%{stroke-dashoffset:0}}
.edge--flowing{stroke-dasharray:6 4;animation:flow .6s linear infinite}
@keyframes dot-flow{0%{offset-distance:0%}100%{offset-distance:100%}}

/* ── Utility ── */
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
</style>
</head>
<body>

<div class="app" id="app">
  <!-- Top bar -->
  <header class="topbar">
    <div class="topbar__brand">
      <div class="topbar__logo" title="多智能体管家">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="22" height="22" rx="5.5" fill="var(--accent-strong)"/>
          <path d="M7.5 10.6 12 13.2 M12 13.2 16.5 11.7" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
          <circle cx="7.5" cy="8" r="2.6" fill="#fff"/>
          <circle cx="12" cy="15.5" r="2.6" fill="#fff"/>
          <circle cx="16.5" cy="9" r="2.6" fill="#fff"/>
        </svg>
      </div>
      <span>多智能体管家</span>
      <span class="topbar__sub">多Agent 编排控制台</span>
    </div>
    <div class="topbar__sep"></div>
    <div class="topbar__title">多Agent 协作编排 · 架构 → 实现 → 审查</div>
    <div class="topbar__spacer"></div>
    <div class="topbar__cwd" style="display:flex;align-items:center;gap:6px">
      <span style="font-size:11px;color:var(--muted);white-space:nowrap">工作目录:</span>
      <span id="cwd-display" style="font-family:var(--mono);font-size:11px;color:var(--fg-2);max-width:min(360px,34vw);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;padding:3px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg)" title="点击修改工作目录（悬停可见完整路径）" onclick="showCwdEditor()"></span>
      <input id="cwd-input" type="text" style="display:none;height:24px;width:min(400px,40vw);font-family:var(--mono);font-size:11px;border:1px solid var(--accent);border-radius:5px;background:var(--bg);color:var(--fg);padding:0 8px;outline:none" />
      <button id="cwd-confirm" class="topbar__btn" style="display:none;height:22px;padding:0 6px;font-size:11px" onclick="confirmCwd()">确定</button>
    </div>
    <div class="topbar__preset">
      <select id="preset-select" title="加载预设模板">
        <option value="">加载预设...</option>
      </select>
    </div>
    <div class="topbar__status">
      <span class="topbar__dot" id="sse-dot"></span>
      <span id="sse-status">未连接</span>
    </div>
    <button class="topbar__btn" id="btn-selfcheck" title="一键自检：查看 Agent、模型、Skill 库与执行器可用性">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      自检
    </button>
    <button class="topbar__btn" id="btn-save-pipeline" title="保存管道">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
      保存
    </button>
    <button class="topbar__btn topbar__btn--accent" id="btn-execute" title="执行当前管道">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      执行
    </button>
  </header>

  <!-- Left sidebar nav -->
  <nav class="sidebar">
    <button class="nav-btn nav-btn--active" data-panel="chat" title="对话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span class="nav-btn__label">对话</span>
    </button>
    <button class="nav-btn" data-panel="pipeline" title="管道编辑器">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></svg>
      <span class="nav-btn__label">管道编辑器</span>
    </button>
    <button class="nav-btn" data-panel="data" title="执行记录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span class="nav-btn__label">执行记录</span>
    </button>
    <button class="nav-btn" id="btn-new-session" title="新建会话">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      <span class="nav-btn__label">新建会话</span>
    </button>
    <div class="sidebar__history">
      <div class="sidebar__history-title">历史会话</div>
      <div class="history__list" id="history-list">
        <div style="text-align:center;color:var(--muted-2);padding:16px;font-size:12px">加载中...</div>
      </div>
    </div>
  </nav>

  <!-- Main content area -->
  <main class="main" id="main">
    <!-- Chat panel -->
    <div class="panel panel--active" id="panel-chat">
      <div class="chat">
        <div class="chat__messages" id="chat-messages">
          <div class="chat__welcome" id="chat-welcome">
            <div class="hero__title">把任务交给我，剩下的我来编排</div>
            <div class="hero__sub"><b>架构师 → 执行者 → 审查者</b> 协作完成你的任务</div>
            <div class="hero__box">
              <textarea class="hero__input" id="hero-input" rows="2" placeholder="描述你的任务，例如：实现端口范围解析函数并补测试"></textarea>
              <button class="hero__send" id="hero-send" title="生成编排"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15" style="flex-shrink:0"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg></button>
            </div>
            <div class="hero__chips">
              <button class="hero__chip" data-sample="实现一个端口范围解析函数，支持单端口/连续范围/逗号组合与边界错误场景，含表格驱动测试，仅标准库">端口范围解析</button>
              <button class="hero__chip" data-sample="重构 internal/loopdemo 模块，补齐错误处理与完整测试">重构并补测试</button>
              <button class="hero__chip" data-sample="审查当前工作区代码质量并给出改进建议">代码审查</button>
            </div>
          </div>
        </div>
        <div class="chat__opts" id="chat-opts">
          <span class="chat__opt-label">分析执行器</span>
          <select class="chat__opt" id="chat-executor" title="需求分析使用的执行器"></select>
          <span class="chat__opt-label">分析模型</span>
          <select class="chat__opt" id="chat-model" title="需求分析使用的模型"></select>
        </div>
        <div class="chat__input-bar" id="chat-input-bar">
          <textarea class="chat__input" id="chat-input" rows="1" placeholder="输入需求，Enter 发送，Shift+Enter 换行…" autocomplete="off"></textarea>
          <button class="chat__send" id="chat-send" title="生成编排">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Pipeline editor panel -->
    <div class="panel" id="panel-pipeline">
      <div class="pipeline">
        <div class="pipeline__toolbar">
          <button class="pipe-btn" id="add-node-pro" title="添加架构师">
            <span style="width:8px;height:8px;border-radius:50%;background:var(--blue);display:inline-block"></span>
            + 架构师
          </button>
          <button class="pipe-btn" id="add-node-flash" title="添加审查者">

<script>
// ── State ──
const state = {
  activePanel: 'chat',
  nodes: [
    { id: 1, name: '架构师', type: 'architect', model: 'deepseek-pro', skill: 'brainstorming', mode: 'serve', role: '设计系统架构', x: 60, y: 160, status: 'idle', executor: 'reasonix', agent: '' },
    { id: 2, name: '执行者', type: 'executor', model: 'mimo-v2.5-pro', skill: '', mode: 'serve', role: '编码实现', x: 310, y: 160, status: 'idle', executor: 'mimo', agent: '' },
    { id: 3, name: '审查者', type: 'reviewer', model: 'deepseek-flash', skill: 'review', mode: 'serve', role: '审查代码', x: 560, y: 160, status: 'idle', executor: 'reasonix', agent: '' },
  ],
  edges: [
    { from: 1, to: 2, mode: 'linear' },
    { from: 2, to: 3, mode: 'linear' },
  ],
  selectedNode: null,
  draggingNode: null,
  dragOffset: { x: 0, y: 0 },
  connectingFrom: null,
  tempEdge: null,
  pipelineId: null,
  pipelineName: '新管道',
  runId: null,
  runStatus: null,
  chatMessages: [],
  requirementMessages: [], // 用户需求 + Flash 分析结果（用于 /requirements/analyze history）
  pipelineMessages: [],   // 流水线执行日志（工具调用、节点状态等）
  nodeOutputs: {},  // nodeId → { input, output, error, startedAt, doneAt }
  rewrittenTask: '', // Flash 改写后的需求文本
  runtimeStates: {}, // { runtimeID: runtime } — serve runtime 状态
  sessionID: '',    // 当前会话 ID（用于保存/加载状态）
  // Pipeline hydration is a guard against stale UI state overwriting the
  // revision that is still being loaded. LoopConfig is kept separately from
  // the controls so an automatic save can never fall back to the HTML defaults.
  pipelineHydrated: false,
  pipelineRevisionID: '',
  loadedLoopConfig: { enabled: false },
  loopConfigDirty: false,
  nodeTypes: [],
  models: [],
  skills: [],
  skillCatalog: [],
  presets: [],
  stats: null,
  runs: [],
  runIterations: {},
  agents: [],
  sseConnection: null,
  nextNodeId: 4,
  canvasOffset: { x: 0, y: 0 },
};

function edgeId(edge, index) {
  if (edge && edge.id) return String(edge.id);
  const from = edge?.from ?? 'x';
  const to = edge?.to ?? 'y';
  return `e-${from}-${to}-${index}`;
}

function normalizeNode(raw) {
  return {
    id: raw.id,
    name: raw.name,
    type: raw.type,
    model: raw.model || '',
    providerRoute: raw.providerRoute || ((['codex', 'claude'].includes(raw.executor) && ['ccs', 'ccswitch'].includes(String(raw.model || '').toLowerCase())) ? 'ccswitch' : ''),
    agent: raw.agent || '',
    skill: raw.skill || '',
    mode: raw.mode || 'serve',
    executor: raw.executor || 'reasonix',
    role: raw.role || '',
    x: raw.x || 60,
    y: raw.y || 60,
    status: raw.status || 'idle',
  };
}

function normalizeEdge(raw, index) {
  return {
    id: edgeId(raw, index),
    from: raw.from,
    to: raw.to,
    mode: raw.mode || 'linear',
  };
}

function findRuntimeForNode(node) {
  if (!Array.isArray(state.agents)) return null;
  return state.agents.find(a =>
    (a.label === node.name && (!a.executor || a.executor === (node.executor || 'reasonix'))) ||
    (a.model === node.model && a.label === node.name)
  ) || null;
}

function inferExecutorFromModel(model) {
  const m = String(model || '').toLowerCase();
  if (m.includes('/mimo-') || m.startsWith('mimo')) return 'mimo';
  if (m === 'ccs' || m === 'ccswitch' || m === 'o3' || m === 'codex-default' || m.includes('codex')) return 'codex';
  // deepseek-v4-* are Codex-native models (official direct via codex profile).
  if (m.startsWith('deepseek-v4')) return 'codex';
  if (m === 'opus' || m === 'sonnet' || m === 'haiku' || m === 'claude-fable-5' || m.includes('claude')) return 'claude';
  return 'reasonix';
}

function isMimoModel(model) {
  const m = String(model || '').toLowerCase();
  return m.startsWith('mimo') || m.includes('/mimo-');
}

function modelSupportsExecutor(model, executor) {
  const m = String(model || '').trim();
  if (!m) return true;
  const node = state.selectedNode ? state.nodes.find(n => n.id === state.selectedNode) : null;
  const typeInfo = state.nodeTypes.find(t => t.type === (node?.type || 'executor'));
  const byExec = typeInfo?.modelsByExecutor || {};
  const allowed = byExec[executor] || [];
  if (allowed.length > 0 && allowed.includes(m)) return true;
  // codex/claude own provider resolution: self-configured models (deepseek-xxx,
  // claude full names, ...) pass through even when not in the preset list.
  if (allowed.length > 0 && (executor === 'codex' || executor === 'claude')) return true;
  if (allowed.length > 0) return false;
  const mimo = isMimoModel(m);
  if (executor === 'mimo') return mimo;
  if (executor === 'codex') return true;
  if (executor === 'claude') return true;
  if (executor === 'reasonix') return true;
  return false;
}

function compatibleModelsForNode(node, executorOverride) {
  const activeType = node?.type || 'executor';
  const activeExecutor = executorOverride || node?.executor || 'reasonix';
  const typeInfo = state.nodeTypes.find(t => t.type === activeType);
  const byExec = typeInfo?.modelsByExecutor || {};
  const models = byExec[activeExecutor] || [];
  return [...new Set(models.filter(Boolean))];
}

function allModelsForNodeType(node) {
  const activeType = node?.type || 'executor';
  const typeInfo = state.nodeTypes.find(t => t.type === activeType);
  const byExec = typeInfo?.modelsByExecutor || {};
  const models = [];
  Object.values(byExec).forEach(items => {
    (items || []).forEach(item => models.push(item));
  });
  if (models.length === 0) {
    (typeInfo?.models || []).forEach(item => models.push(item));
  }
  return [...new Set(models.filter(Boolean))];
}

function firstCompatibleModelForNode(node, executorOverride) {
  const models = compatibleModelsForNode(node, executorOverride);
  return models[0] || '';
}

function syncExecutorOptionsForNode(node) {
  const sel = $('#cfg-executor');
  const options = Array.from(sel.options);
  const typeInfo = state.nodeTypes.find(t => t.type === node?.type);
  const allowedExecutors = (typeInfo?.executors || []).map(String);

  // Enable/disable options based on what the node type supports
  options.forEach(opt => {
    if (allowedExecutors.length > 0) {
      opt.disabled = !allowedExecutors.includes(opt.value);
    } else {
      opt.disabled = false;
    }
  });

  // If current executor is not allowed, pick the first allowed one
  if (allowedExecutors.length > 0 && !allowedExecutors.includes(node.executor)) {
    node.executor = allowedExecutors[0];
  }
  sel.value = node.executor || 'reasonix';

  // Codex/Claude support both modes: run uses a one-shot CLI; serve uses a
  // retained Runtime (app-server / stream-json) managed by Orchestrator.
  const isCodex = node.executor === 'codex';
  const isClaude = node.executor === 'claude';
  const modeSelect = $('#cfg-mode');
  if ((isCodex || isClaude) && !['run', 'serve'].includes(node.mode)) node.mode = 'serve';
  modeSelect.value = node.mode || 'serve';
  modeSelect.disabled = false;
  modeSelect.title = isCodex
    ? 'Codex：run 使用一次性 exec；serve 使用保留 Runtime（app-server）'
    : (isClaude ? 'Claude：run 使用一次性 claude -p；serve 使用保留 Runtime（stream-json）' : '');
}

function enforceNodeConstraints(node) {
  if (!node.executor) node.executor = inferExecutorFromModel(node.model);
  // Codex/Claude support `run` (one-shot CLI) and `serve` (retained Runtime).
  if (node.executor === 'codex' || node.executor === 'claude') {
    if (!['run', 'serve'].includes(node.mode)) node.mode = 'serve';
    if (!node.model) {
      node.model = 'ccs';
      node.providerRoute = 'ccswitch';
    }
  } else if (!node.mode) {
    node.mode = 'serve';
  }
  if (!node.agent) node.agent = '';
  if (!node.skill) node.skill = '';
  if (!node.model || !modelSupportsExecutor(node.model, node.executor || 'reasonix')) {
    node.model = firstCompatibleModelForNode(node) || node.model || '';
  }
  if (!modelSupportsExecutor(node.model, node.executor || 'reasonix')) {
    const typeInfo = state.nodeTypes.find(t => t.type === node?.type);
    const fallbackExecutor = (typeInfo?.executors || []).find(ex => modelSupportsExecutor(node.model, ex));
    if (fallbackExecutor) {
      node.executor = fallbackExecutor;
      node.model = firstCompatibleModelForNode(node, fallbackExecutor) || node.model || '';
    }
  }
}

// ── API helpers ──
// Most orchestrator APIs are local CRUD calls and should fail quickly.  LLM
// backed requirement analysis is different: the server starts a model
// subprocess and may legitimately need several minutes before it returns the
// structured pipeline.  Giving every endpoint the same 15s deadline caused
// the browser to abort the request, which also cancelled the server-side
// subprocess through r.Context(). SSE being "connected" does not change that;
// SSE and ordinary fetch requests have independent lifecycles.
const API_TIMEOUTS = {
  '/requirements/analyze': 260000,
  '/requirements/expand': 120000,
  '/requirements/understand': 120000,
};

// Run-progress analysis drives a model subprocess server-side (same class of
// slow call as /requirements/analyze) and the path embeds a dynamic run ID,
// so exact keys cannot cover it — match by shape. Runtime console messages
// run a full model turn on the retained opencode serve (up to 10 minutes
// server-side); the default 15s deadline would abort before the answer.
function apiTimeoutMs(path) {
  if (API_TIMEOUTS[path]) return API_TIMEOUTS[path];
  if (path === '/analysis/options') return 60000;
  if (/^\/runs\/[^/]+\/analysis$/.test(path)) return 260000;
  if (/^\/runtimes\/[^/]+\/message$/.test(path)) return 300000;
  return 15000;
}

async function api(method, path, body) {
  const controller = new AbortController();
  const timeoutMs = apiTimeoutMs(path);
  const timeout = setTimeout(() => controller.abort(), timeoutMs);
  const opts = {
    method,
    headers: { 'content-type': 'application/json' },
    signal: controller.signal
  };
  if (body) opts.body = JSON.stringify(body);
  try {
    const res = await fetch('/orchestrator/api' + path, opts);
    if (!res.ok) {
      let detail = '';
      try { detail = (await res.text()) || ''; } catch (_) {}
      const suffix = detail ? ' — ' + detail.slice(0, 300) : '';
      throw new Error(`API ${method} ${path}: ${res.status} ${res.statusText}${suffix}`);
    }
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  } catch (err) {
    if (err && err.name === 'AbortError') {
      const seconds = Math.round(timeoutMs / 1000);
      throw new Error(`API ${method} ${path}: 请求超时（${seconds}秒），请确认 orchestrator 服务仍在运行或模型仍在响应`);
    }
    throw err;
  } finally {
    clearTimeout(timeout);
  }
}

// For main server endpoints (e.g. /history, /status, /submit)
async function mainApi(method, path, body) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  const opts = {
    method,
    headers: { 'content-type': 'application/json' },
    signal: controller.signal
  };
  if (body) opts.body = JSON.stringify(body);
  try {
    const res = await fetch(path, opts);
    if (!res.ok) throw new Error(`API ${method} ${path}: ${res.status} ${res.statusText}`);
    const text = await res.text();
    return text ? JSON.parse(text) : null;
  } catch (err) {
    if (err && err.name === 'AbortError') {
      throw new Error(`API ${method} ${path}: 请求超时（15秒），请确认主服务仍在运行`);
    }
    throw err;
  } finally {
    clearTimeout(timeout);
  }
}

async function apiGet(path) { return api('GET', path); }
async function apiPost(path, body) { return api('POST', path, body); }
async function apiPut(path, body) { return api('PUT', path, body); }
async function apiDelete(path) { return api('DELETE', path); }

// Keep the current canvas and execution bound to the orchestration session.
// The legacy pipeline API is used only when the page has no session yet.
async function saveCurrentPipelineRevision(pipeline) {
  if (state.sessionID && !state.pipelineHydrated) {
    throw new Error('当前会话流水线仍在加载，已跳过保存以避免覆盖 Loop 配置');
  }
  const loopConfig = normalizeLoopConfigForSave(pipeline?.loopConfig);
  if (!state.sessionID) {
    // Keep the legacy fallback payload compatible with the complete save
    // shape as well. Legacy handlers may ignore source, but loopConfig must
    // never disappear merely because a session has not been created yet.
    const legacyPayload = {
      name: pipeline.name,
      nodes: pipeline.nodes,
      edges: pipeline.edges,
      loopConfig,
      source: 'manual_edit'
    };
    if (!state.pipelineId) {
      const saved = await apiPost('/pipelines', legacyPayload);
      state.pipelineId = saved.id;
    } else {
      await apiPost('/pipelines/' + state.pipelineId, legacyPayload);
    }
    return state.pipelineId;
  }
  const payload = {
    name: pipeline.name,
    nodes: pipeline.nodes,
    edges: pipeline.edges,
    loopConfig,
    source: 'manual_edit'
  };
  if (state.pipelineRevisionID || state.pipelineId) {
    payload.baseRevisionID = state.pipelineRevisionID || state.pipelineId;
  }
  const revision = await apiPut('/orch-sessions/' + state.sessionID + '/pipelines/current', payload);
  if (!revision || !revision.id) throw new Error('服务端未返回 pipeline revision ID');
  state.pipelineId = revision.id;
  state.pipelineRevisionID = revision.id;
  state.loadedLoopConfig = normalizeLoopConfigForSave(revision.loopConfig || loopConfig);
  state.loopConfigDirty = false;
  state.pipelineHydrated = true;
  return revision.id;
}

async function refreshHistory() {
  // Switching to the history panel can fire more than once (navigation,
  // explicit refresh, and a post-delete refresh). Reuse the in-flight request
  // and ignore stale responses so an older, slower response cannot repaint the
  // list after a newer one.
  if (historyRefreshInFlight) return historyRefreshInFlight;
  const generation = ++historyRefreshGeneration;
  historyView = 'list';
  historyList.innerHTML = '<div style="text-align:center;color:var(--muted-2);padding:20px;font-size:13px">加载中...</div>';
  const request = (async () => {
    try {
      const [nativeResult, orchestrationResult] = await Promise.allSettled([
        mainApi('GET', '/sessions?limit=200'),
        apiGet('/orch-sessions?limit=200')
      ]);
      if (generation !== historyRefreshGeneration) return;
      if (nativeResult.status === 'rejected' && orchestrationResult.status === 'rejected') {
        const nativeMessage = nativeResult.reason?.message || '主会话 API 不可用';
        const orchestrationMessage = orchestrationResult.reason?.message || '编排 API 不可用';
        throw new Error(nativeMessage + '；' + orchestrationMessage);
      }
      const nativeSessions = nativeResult.status === 'fulfilled' && Array.isArray(nativeResult.value)
        ? nativeResult.value : [];
      const orchestrationSessions = orchestrationResult.status === 'fulfilled' && Array.isArray(orchestrationResult.value)
        ? orchestrationResult.value.filter(s => s && String(s.status || '').toLowerCase() !== 'archived') : [];
      const byPath = new Map(nativeSessions.filter(s => s && s.path).map(s => [s.path, s]));
      const merged = orchestrationSessions.map(s => {
        const native = byPath.get(s.nativeSessionPath || '');
        return {
          ...(native || {}),
          name: native?.name || s.nativeSessionName || s.title || s.id,
          path: s.nativeSessionPath || native?.path || '',
          modTime: s.updatedAt ? Date.parse(s.updatedAt) : native?.modTime,
          orchestrationSessionID: s.id,
          orchestrationTitle: s.title,
          current: !!state.sessionID && state.sessionID === s.id
        };
      });
      const knownPaths = new Set(merged.map(s => s.path).filter(Boolean));
      renderSessionList(merged.concat(nativeSessions.filter(s => !knownPaths.has(s.path))));
    } catch (err) {
      if (generation !== historyRefreshGeneration) return;
      historyList.innerHTML = '<div class="history-empty">加载失败: ' + escHtml(err.message) + '</div>';
    }
  })();
  historyRefreshInFlight = request;
  try { await request; } finally {
    if (historyRefreshInFlight === request) historyRefreshInFlight = null;
  }
}

async function deleteOrchestrationSession(sessionID, title, nativeName, nativePath) {
  if (!sessionID) return;
  if (state.sessionID && state.sessionID === sessionID) {
    toast('当前会话不能删除，请先切换到其他会话', 'error');
    return;

    await apiDelete('/orch-sessions/' + encodeURIComponent(sessionID));

    // Remove that entry too, otherwise refreshHistory would immediately add
    // it back as a native-only history card after the orchestration record is
    // archived. Never attempt this for the current native session.
    if (nativeName && nativePath && !(state.sessionID && state.sessionID === sessionID)) {
      try { await mainApi('POST', '/delete-session', { name: nativeName }); } catch (nativeErr) {
        console.warn('[history] orchestration deleted, native session cleanup failed:', nativeErr);

function renderSessionList(sessions) {
  if (!sessions || sessions.length === 0) {
    historyList.innerHTML = '<div class="history-empty">暂无历史会话</div>';
    return;
  }
  // The currently open session stays pinned on top; the rest follow recency.
  const sorted = sessions.slice().sort((a, b) =>
    (b.current ? 1 : 0) - (a.current ? 1 : 0) ||
    (Number(b.modTime) || 0) - (Number(a.modTime) || 0));
  const maxVisible = 200;
  const visible = sorted.slice(0, maxVisible);
  historyList.innerHTML = '';
  const fragment = document.createDocumentFragment();
  for (const s of visible) {
    const card = document.createElement('div');
    card.className = 'session-card' + (s.current ? ' session-card--current' : '');
    const name = s.name || 'unknown';
    const date = s.modTime ? new Date(s.modTime).toLocaleString() : '';
    const size = s.size ? (s.size / 1024).toFixed(1) + ' KB' : '';
    const meta = [date, size].filter(Boolean).join(' · ');

    const info = document.createElement('div');
    info.className = 'session-card__info';
    info.innerHTML = '<div class="session-card__name">' + escHtml(name) + '</div>'
      + (meta ? '<div class="session-card__meta">' + escHtml(meta) + '</div>' : '');
    card.appendChild(info);

    const actions = document.createElement('div');
    actions.className = 'session-card__actions';
    if (s.orchestrationSessionID) {
      const renameBtn = document.createElement('button');
      renameBtn.className = 'session-card__btn';
      renameBtn.title = '重命名会话';
      renameBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>';
      renameBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const oldTitle = s.orchestrationTitle || name;
        const newTitle = await openSessionNameModal('重命名会话', oldTitle);
        if (newTitle === null || newTitle === oldTitle) return;
        try {
          await apiPut('/orch-sessions/' + encodeURIComponent(s.orchestrationSessionID), { title: newTitle });
          toast('会话已重命名: ' + newTitle, 'success');
          await refreshHistory();
        } catch (err) {
          toast('重命名失败: ' + err.message, 'error');
        }
      });
      actions.appendChild(renameBtn);
    }
    if (s.current) {
      const span = document.createElement('span');
      span.style.cssText = 'font-size:10px;color:var(--accent);padding:0 6px';
      span.textContent = '当前';
      actions.appendChild(span);
    } else {
      if (s.orchestrationSessionID || s.name) {
        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'session-card__btn session-card__btn--danger';
        deleteBtn.title = '删除会话';
        deleteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>';
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (s.orchestrationSessionID) {
            deleteOrchestrationSession(s.orchestrationSessionID, s.orchestrationTitle || name, s.name, s.path);
          } else {
            deleteNativeSession(s.name, name);
          }
        });
        actions.appendChild(deleteBtn);
      }
      const btn = document.createElement('button');
      btn.className = 'session-card__btn';
      btn.title = s.orchestrationSessionID ? '切换到此编排会话' : '恢复此会话';
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
      const sessionPath = s.path;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (s.orchestrationSessionID) switchOrchestrationSession(s.orchestrationSessionID, s.orchestrationTitle || name);
        else resumeSession(sessionPath);
      });
      actions.appendChild(btn);
    }
    card.appendChild(actions);
    if (!s.current) {
      const sessionName = s.name;
      const sessionTitle = s.orchestrationTitle || name;
      const sessionPath = s.path;
      card.addEventListener('click', () => {
        if (s.orchestrationSessionID) switchOrchestrationSession(s.orchestrationSessionID, sessionTitle);
        else loadSessionMessages(sessionName, sessionTitle, sessionPath);
      });
    }
    fragment.appendChild(card);
  }
  historyList.appendChild(fragment);
  if (sorted.length > maxVisible) {
    const note = document.createElement('div');
    note.className = 'history-empty';
    note.style.padding = '12px';
    note.textContent = `仅显示最近 ${maxVisible} 条历史记录，共 ${sorted.length} 条`;
    historyList.appendChild(note);
  }
}

async function switchOrchestrationSession(sessionID, title) {
  if (!sessionID) return;
  if (state.sessionID === sessionID) {
    switchPanel('chat');
    return;
  }
  try {
    if (state.sessionID) await saveOrchestratorState(state.sessionID);
    // Invalidate the current canvas before binding the new session. This
    // makes any save triggered during load a no-op instead of a stale write.
    state.pipelineHydrated = false;
    state.pipelineRevisionID = '';
    state.pipelineId = null;
    state.nodes = [];
    state.edges = [];
    state.loadedLoopConfig = { enabled: false };
    state.loopConfigDirty = false;
    state.sessionID = sessionID;
    localStorage.setItem('orchestrator-session-id', sessionID);
    // Load the canvas/conversation and the runs list in parallel — loadRuns
    // only needs the session ID, so sequencing them doubles the latency for
    // no reason.
    await Promise.all([loadOrchestratorState(sessionID), loadRuns()]);
    switchPanel('chat');
    toast('已切换到历史编排会话', 'success');
    // The dock marks the current session from state.sessionID; refresh it so
    // the badge and enter button move to the newly active session (otherwise
    // the old session keeps showing 当前 with no way to return).
    await refreshHistory();
  } catch (err) {
    toast('切换失败: ' + err.message, 'error');
  }
}

async function loadOrchestrationSessionDetail(sessionID, title, nativePath) {
  historyView = 'detail';
  historyList.innerHTML = '<div style="padding:12px">加载中...</div>';
  try {
    const [conversation, session] = await Promise.all([
      apiGet('/orch-sessions/' + sessionID + '/conversation'),
      apiGet('/orch-sessions/' + sessionID)
    ]);
    const messages = conversation.chatMessages || [];
    historyList.innerHTML = '';
    const header = document.createElement('div');
    header.style.cssText = 'padding:12px;display:flex;align-items:center;gap:8px';
    const back = document.createElement('span');
    back.className = 'history__back'; back.textContent = '← 返回'; back.onclick = refreshHistory;
    header.appendChild(back);
    const titleEl = document.createElement('span');
    titleEl.style.cssText = 'font-size:13px;color:var(--fg-2);flex:1'; titleEl.textContent = title;
    header.appendChild(titleEl);
    const switchBtn = document.createElement('button');
    switchBtn.className = 'topbar__btn topbar__btn--accent';
    switchBtn.textContent = '切换到此会话';
    switchBtn.onclick = () => switchOrchestrationSession(sessionID, title);
    header.appendChild(switchBtn);
    if (nativePath) {
      const btn = document.createElement('button');
      btn.className = 'topbar__btn topbar__btn--accent'; btn.textContent = '恢复此会话';
      btn.onclick = () => resumeSession(nativePath); header.appendChild(btn);
    }
    historyList.appendChild(header);
    if (!messages.length) {
      historyList.insertAdjacentHTML('beforeend', '<div class="history-empty">暂无编排消息</div>');
      return;
    }
    // Build the detail view off-DOM and attach it once. Large orchestration
    // conversations otherwise trigger a layout/repaint for every message.
    const messageFragment = document.createDocumentFragment();
    for (const m of messages) {
      const item = document.createElement('div');
      item.style.cssText = 'padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;white-space:pre-wrap';
      item.innerHTML = '<b>' + escHtml(m.meta || m.role || '') + '</b><br>' + renderMarkdown(m.text || '');
      messageFragment.appendChild(item);
    }
    historyList.appendChild(messageFragment);    void session;
  } catch (err) {
    historyList.innerHTML = '<div class="history-empty">加载失败: ' + escHtml(err.message) + '</div>';
  }
}

async function resumeSession(path) {
  try {
    if (state.sessionID) {
      await saveOrchestratorState(state.sessionID);
    }
    if (!path || !String(path).trim()) throw new Error('该历史记录没有可恢复的原生会话路径，请使用“切换到此编排会话”');
    const resp = await fetch('/resume', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ path: path })
    });
    if (!resp.ok) {
      const detail = (await resp.text()).trim();
      throw new Error(resp.status + ' ' + (detail || resp.statusText));
    }
    await migrateNativeSession(path, path.split(/[\\/]/).pop());
    await refreshChatHistory();
    toast('会话已切换，正在加载...', 'success');
    await refreshHistory();
    setTimeout(() => location.reload(), 300);
  } catch (err) {
    toast('切换失败: ' + err.message, 'error');
  }
}

async function loadSessionMessages(name, title, path) {
  historyView = 'detail';
  historyList.innerHTML = '';

  const header = document.createElement('div');
  header.style.cssText = 'padding:12px;display:flex;align-items:center;gap:8px';

  const back = document.createElement('span');
  back.className = 'history__back';
  back.textContent = '← 返回';
  back.addEventListener('click', refreshHistory);
  header.appendChild(back);

  const titleEl = document.createElement('span');
  titleEl.style.cssText = 'font-size:13px;color:var(--fg-2);flex:1';
  titleEl.textContent = title;
  header.appendChild(titleEl);

  if (path) {
    const resumeBtn = document.createElement('button');
    resumeBtn.className = 'topbar__btn topbar__btn--accent';
    resumeBtn.style.cssText = 'font-size:11px;height:24px';
    resumeBtn.textContent = '恢复此会话';
    const sessionPath = path;
    resumeBtn.addEventListener('click', () => resumeSession(sessionPath));
    header.appendChild(resumeBtn);
  }

  historyList.appendChild(header);

  const loading = document.createElement('div');
  loading.style.cssText = 'text-align:center;color:var(--muted-2);padding:20px;font-size:12px';
  loading.textContent = '加载中...';
  historyList.appendChild(loading);

  try {
    const resp = await fetch('/sessions/' + encodeURIComponent(name) + '/messages');
    if (!resp.ok) throw new Error(resp.status + ' ' + resp.statusText);
    const msgs = await resp.json();
    renderSessionMessages(msgs, name, title, path);
  } catch (err) {
    historyList.innerHTML = '<div style="padding:12px"><span class="history__back" onclick="refreshHistory()">← 返回</span></div>'
      + '<div class="history-empty">加载失败: ' + escHtml(err.message) + '</div>';
  }
}

function renderSessionMessages(msgs, name, title, path) {
  historyList.innerHTML = '';

  const header = document.createElement('div');
  header.style.cssText = 'padding:12px;display:flex;align-items:center;gap:8px';

  const back = document.createElement('span');
  back.className = 'history__back';
  back.textContent = '← 返回';
  back.addEventListener('click', refreshHistory);
  header.appendChild(back);

  const titleEl = document.createElement('span');
  titleEl.style.cssText = 'font-size:13px;color:var(--fg-2);flex:1';
  titleEl.textContent = title;
  header.appendChild(titleEl);

  if (path) {
    const resumeBtn = document.createElement('button');
    resumeBtn.className = 'topbar__btn topbar__btn--accent';
    resumeBtn.style.cssText = 'font-size:11px;height:24px';
    resumeBtn.textContent = '恢复此会话';
    const sessionPath = path;
    resumeBtn.addEventListener('click', () => resumeSession(sessionPath));
    header.appendChild(resumeBtn);
  }

  historyList.appendChild(header);

  if (!msgs || msgs.length === 0) {
    historyList.innerHTML += '<div class="history-empty">暂无消息</div>';
    return;
  }

  const container = document.createElement('div');
  container.style.cssText = 'display:flex;flex-direction:column;gap:8px;padding:0 12px 12px;flex:1;overflow-y:auto';

  for (const m of msgs) {
    const role = m.role || 'unknown';
    // Skip system messages
    if (role === 'system') continue;
    // Skip tool results (too noisy)
    if (role === 'tool') continue;

    const div = document.createElement('div');
    div.className = 'history-msg history-msg--' + role;

    let html = '<div class="history-msg__role">' + escHtml(role) + '</div>';
      if (m.content) html += '<div>' + renderMarkdown(m.content) + '</div>';
    if (m.toolCalls && m.toolCalls.length > 0) {
      for (const tc of m.toolCalls) {
        html += '<div class="history-msg__tool">→ ' + escHtml(tc.name) + '(' + escHtml((tc.arguments || '').substring(0, 100)) + ')</div>';
      }
    }
    div.innerHTML = html;
    container.appendChild(div);
  }

  historyList.appendChild(container);
  historyList.scrollTop = historyList.scrollHeight;
}
