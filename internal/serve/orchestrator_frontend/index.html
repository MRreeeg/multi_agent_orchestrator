presetSelect.addEventListener('change', async () => {
  const id = presetSelect.value;
  console.log('[preset-change] selected id:', id, 'presets count:', state.presets.length);
  if (!id) return;
  const preset = state.presets.find(p => p.id === id);
  console.log('[preset-change] found preset:', preset?.name, 'pipeline nodes:', preset?.pipeline?.nodes?.length);
  if (!preset) return;
  if (state.nodes.length > 0 && !confirm('加载预设将替换当前管道，继续？')) {
    presetSelect.value = '';
    return;
  }
  state.nodes = [];
  state.edges = [];
  state.nextNodeId = 1;
  state.pipelineId = null;
  const pipe = preset.pipeline || {};
  const idMap = {};
  if (pipe.nodes) {
    pipe.nodes.forEach(n => {
      const newId = state.nextNodeId++;
      idMap[n.id] = newId;
      state.nodes.push({
        id: newId,
        name: n.name,
        type: n.type,
        model: n.model || '',
        providerRoute: n.providerRoute || ((['codex', 'claude'].includes(n.executor) && ['ccs', 'ccswitch'].includes(String(n.model || '').toLowerCase())) ? 'ccswitch' : ''),
        agent: n.agent || '',
        skill: n.skill || '',
        mode: n.mode || 'serve',
        executor: n.executor || 'reasonix',
        role: n.role || '',
        x: n.x || 60,
        y: n.y || 60,
        status: 'idle',
      });
    });
  }
  if (pipe.edges) {
    pipe.edges.forEach(e => {
      const fromId = idMap[e.from];
      const toId = idMap[e.to];
      if (fromId != null && toId != null) {
        state.edges.push({ id: edgeId(e, state.edges.length), from: fromId, to: toId, mode: 'linear' });
      }
    });
  }
  state.pipelineName = preset.name || '预设管道';
  console.log('[preset-change] state.nodes now:', state.nodes.length, 'rendering...');
  switchPanel('pipeline');
  requestAnimationFrame(() => {
    renderNodes();
    renderEdges();
    console.log('[preset-change] done, canvas children:', canvas.children.length, 'canvas dims:', canvas.offsetWidth, 'x', canvas.offsetHeight);
  });
  toast('已加载预设: ' + preset.name, 'success');
  presetSelect.value = '';
});

// ── Load models, skills ──
function autoSkillForStep(step, nodeType, taskText = '') {
  const catalog = Array.isArray(state.skillCatalog) ? state.skillCatalog : [];
  const names = new Set(catalog.map(x => String(x?.name || x).toLowerCase()));
  const text = String(taskText || '') + ' ' + String(step?.roleDesc || step?.role || '') + ' ' + String(step?.step || '');
  const lower = text.toLowerCase();
  let preferred = nodeType === 'reviewer'
    ? ['review-agent', 'code-review', 'code-reviewer']
    : nodeType === 'architect'
      ? ['brainstorming', 'design-blueprint', 'json-canvas', 'executing-plans']
      : ['executing-plans', 'frontend-design', 'playwright', 'pdf'];
  if (/论文|学术|文献|research/i.test(lower)) preferred = ['deep-research', 'nature-academic-search', ...preferred];
  const hit = preferred.find(name => names.has(name.toLowerCase()));
  return hit || '';
}

// Convert model-generated aliases/invalid names to a real catalog entry. The
// backend performs the same safety resolution at execution time, but doing it
// here makes the assignment visible on the Canvas and in the node inspector.
function canonicalSkillForNode(skill, nodeType, taskText = '', roleText = '') {
  const catalog = Array.isArray(state.skillCatalog) ? state.skillCatalog : [];
  const requested = String(skill || '').trim();
  if (!catalog.length) return requested;
  const exact = catalog.find(item => String(item?.name || item).toLowerCase() === requested.toLowerCase());
  if (exact) return String(exact.name || exact);
  return autoSkillForStep({ roleDesc: roleText, step: taskText }, nodeType, taskText);
}
async function loadNodeTypes() {
  try {
    const types = await apiGet('/nodes/types');
    state.nodeTypes = types || [];
    try {
      const catalog = await apiGet('/skills');
      state.skillCatalog = Array.isArray(catalog) ? catalog : [];
      state.skills = state.skillCatalog.map(x => x.name).filter(Boolean);
      // Repair defaults and older/generated nodes after the catalog is known.
      state.nodes.forEach(node => {
        node.skill = canonicalSkillForNode(node.skill, node.type, state.rewrittenTask || '', node.role || '');
      });
    } catch (_) {
      state.skillCatalog = [];
    }
    console.log('[orch:config] nodeTypes loaded:', types?.map(t => t.type).join(', '), 'skills:', state.skills.length);
    // Dynamically rebuild executor dropdown from backend capabilities
    const allExecutors = [...new Set(types?.flatMap(t => (t.executors || []).map(String)) || [])];
    console.log('[orch:config] executors:', allExecutors);
    const execSel = $('#cfg-executor');
    const prevVal = execSel.value;
    execSel.innerHTML = '';
    allExecutors.forEach(ex => {
      const opt = document.createElement('option');
      opt.value = ex;
      opt.textContent = ex;
      execSel.appendChild(opt);
    });
    if (prevVal && allExecutors.includes(prevVal)) execSel.value = prevVal;
    populateModelSelect();
    populateSkillSelect();
  } catch (err) { console.warn('loadNodeTypes failed:', err); }
}

function populateModelSelect(node) {
  const sel = $('#cfg-model');
  sel.innerHTML = '<option value="">选择模型...</option>';
  const activeNode = node || (state.selectedNode ? state.nodes.find(n => n.id === state.selectedNode) : null);
  // 按当前 executor 过滤模型
  const executor = activeNode?.executor || 'reasonix';
  const models = compatibleModelsForNode(activeNode, executor);
  models.forEach(m => {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = m;
    sel.appendChild(opt);
  });
  // 自配模型入口：codex/claude 透传任意模型名给 CLI（如 deepseek-xxx）。
  const custom = document.createElement('option');
  custom.value = '__custom__';
  custom.textContent = '✏️ 自定义模型…';
  sel.appendChild(custom);
  sel.value = activeNode?.model || '';
}

function populateSkillSelect(node) {
  const sel = $('#cfg-skill');
  sel.innerHTML = '<option value="">无</option>';
  const activeNode = node || (state.selectedNode ? state.nodes.find(n => n.id === state.selectedNode) : null);
  const activeType = activeNode?.type || 'executor';
  const typeInfo = state.nodeTypes.find(t => t.type === activeType);
  const skills = state.skillCatalog.length
    ? state.skillCatalog.map(x => x.name).filter(Boolean)
    : (typeInfo?.skills || state.nodeTypes.flatMap(t => t.skills || []));
  const unique = [...new Set(skills)];
  unique.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    sel.appendChild(opt);
  });
  if (activeNode) {
    activeNode.skill = canonicalSkillForNode(activeNode.skill, activeNode.type, state.rewrittenTask || '', activeNode.role || '');
    sel.value = activeNode.skill || '';
  }
}

// ── Load stats ──
async function loadStats() {
  try {
    const stats = await apiGet('/stats');
    state.stats = stats;
    if (stats) {
      $('#stat-total-tokens').textContent = formatNumber(stats.totalTokens || 0);
      $('#stat-total-cost').textContent = '¥' + (stats.totalCostYuan || 0).toFixed(4);
      $('#stat-total-time').textContent = formatDuration(stats.totalDurationMs || 0);
      renderNodeStats(stats.perNode || []);
    }
  } catch (err) { console.warn('loadStats failed:', err); }
}

function renderNodeStats(nodes) {
  const tbody = $('#stats-node-body');
  if (!nodes.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted-2)">暂无数据</td></tr>';
    return;
  }
  const typeLabels = { architect: '架构师', executor: '执行者', reviewer: '审查者' };
  tbody.innerHTML = nodes.map(n => `
    <tr>
      <td>${escHtml(typeLabels[n.type] || n.type)}</td>
      <td class="mono">${n.runCount || 0}</td>
      <td class="mono">${formatNumber(n.tokenSum || 0)}</td>
      <td class="mono">¥${(n.costYuan || 0).toFixed(4)}</td>
    </tr>
  `).join('');
}

// ── Load runs ──
async function loadAgents() {
  try {
    const agents = await apiGet('/agents');
    state.agents = agents || [];
  } catch (err) { console.warn('loadAgents failed:', err); }
}

async function loadRuns() {
  const list = $('#runs-list');
  if (!state.sessionID) {
    state.runs = [];
    state.runIterations = {};
    list.innerHTML = '<div style="text-align:center;color:var(--muted-2);padding:20px;font-size:13px">请先选择一个会话</div>';
    return;
  }
  try {
    state.runs = await apiGet('/orch-sessions/' + encodeURIComponent(state.sessionID) + '/runs');
    state.runs = Array.isArray(state.runs) ? state.runs : [];
    state.runIterations = {};
    await Promise.all(state.runs.map(async r => {
      if (!r?.id || !r.loopConfig?.enabled) return;
      try {
        const iterations = await apiGet('/orch-sessions/' + encodeURIComponent(state.sessionID) + '/runs/' + encodeURIComponent(r.id) + '/iterations');
        state.runIterations[r.id] = Array.isArray(iterations) ? iterations : [];
      } catch (_) { state.runIterations[r.id] = []; }
    }));
  } catch (e) {
    state.runs = [];
    state.runIterations = {};
  }
  renderRuns();
}

async function resumeLoopRun(runID) {
  if (!state.sessionID || !runID) return;
  try {
    await apiPost('/orch-sessions/' + encodeURIComponent(state.sessionID) + '/runs', {
      resumeRunID: runID,
      trigger: 'resume'
    });
    toast('Loop 已继续执行', 'success');
    await loadRuns();
  } catch (err) {
    toast('继续 Loop 失败: ' + err.message, 'error');
  }
}

async function cancelOrchRun(runID) {
  if (!state.sessionID || !runID) return;
  try {
    await apiPost('/orch-sessions/' + encodeURIComponent(state.sessionID) + '/runs/' + encodeURIComponent(runID) + '/cancel', {});
    toast('已请求停止当前 Loop', 'success');
    await loadRuns();
  } catch (err) {
    toast('停止 Loop 失败: ' + err.message, 'error');
  }
}

function renderRuns() {
  const list = $('#runs-list');
  const runs = state.runs || [];
  if (!runs.length) {
    list.innerHTML = '<div style="text-align:center;color:var(--muted-2);padding:20px;font-size:13px">暂无执行记录</div>';
    return;
  }
  const statusIcons = { running: '⏳', complete: '✅', failed: '❌', canceled: '🚫', blocked: '⛔', interrupted: '⏸️' };
  list.innerHTML = runs.map(r => {
    const icon = statusIcons[r.status] || '⏳';
    const taskPreview = (r.task || '').substring(0, 60);
    const nodeCount = r.nodeStates ? Object.keys(r.nodeStates).length : 0;
    const successCount = r.nodeStates ? Object.values(r.nodeStates).filter(ns => ns.status === 'complete').length : 0;
    const failCount = r.nodeStates ? Object.values(r.nodeStates).filter(ns => ns.status === 'failed').length : 0;
    const started = r.startedAt ? new Date(r.startedAt).toLocaleTimeString() : '';
    const finished = r.finishedAt ? new Date(r.finishedAt).toLocaleTimeString() : '';
    const trigger = r.trigger || 'manual';
    const cfg = r.loopConfig || {};
    const iterations = state.runIterations[r.id] || [];
    const mode = cfg.enabled ? (cfg.mode || 'review_decides') : '';
    const max = mode === 'fixed' ? (cfg.fixedIterations || cfg.maxIterations || 0) : (cfg.maxIterations || 0);
    const current = r.currentIteration || (iterations.length ? iterations[iterations.length - 1].number : 0);
    const finalDecision = r.finalReview?.decision || (iterations.length ? iterations[iterations.length - 1].decision : '');
    const resumeButton = r.status === 'interrupted' && cfg.enabled
      ? `<button class="run-resume-btn" data-resume-run="${escHtml(r.id)}" style="margin-top:7px;padding:4px 9px;border:1px solid var(--accent);border-radius:5px;background:transparent;color:var(--accent);cursor:pointer;font-size:11px">继续 Loop</button>` : '';
    const cancelButton = r.status === 'running'
      ? `<button class="run-cancel-btn" data-cancel-run="${escHtml(r.id)}" style="margin-top:7px;margin-left:6px;padding:4px 9px;border:1px solid var(--danger);border-radius:5px;background:transparent;color:var(--danger);cursor:pointer;font-size:11px">停止</button>` : '';
    return `
    <div class="run-card" style="cursor:pointer;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:6px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:16px">${icon}</span>
        <span style="font-weight:600;font-size:12px;flex:1">${escHtml(r.id || '')}</span>
        <span style="font-size:11px;color:var(--muted-2)">${escHtml(r.status)}</span>
      </div>
      ${taskPreview ? `<div style="font-size:11px;color:var(--muted-2);margin-top:4px">${escHtml(taskPreview)}</div>` : ''}
      <div style="font-size:11px;color:var(--muted-2);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap">
        <span>节点: ${successCount}/${nodeCount}</span>
        ${failCount > 0 ? `<span style="color:var(--danger)">失败: ${failCount}</span>` : ''}
        <span>触发: ${escHtml(trigger)}</span>
        ${started ? `<span>${started}${finished ? ' → ' + finished : ''}</span>` : ''}
      </div>
      ${cfg.enabled ? `<div style="font-size:11px;color:var(--muted-2);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap">
        <span>Loop：第 ${current} / ${max} 轮</span><span>模式：${escHtml(mode)}</span>
        ${r.terminationReason ? `<span>终止原因：${escHtml(r.terminationReason)}</span>` : ''}
        ${finalDecision ? `<span>最终 Review：${escHtml(finalDecision)}</span>` : ''}
      </div>` : ''}
      ${r.error ? `<div style="font-size:11px;color:var(--danger);margin-top:4px">${escHtml(r.error.substring(0, 100))}</div>` : ''}
      ${resumeButton}${cancelButton}
    </div>`;
  }).join('');
  list.querySelectorAll('[data-resume-run]').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      resumeLoopRun(btn.getAttribute('data-resume-run'));
    });
  });
  list.querySelectorAll('[data-cancel-run]').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      cancelOrchRun(btn.getAttribute('data-cancel-run'));
    });
  });
}

function showSessionDetail(session, runs) {
  const statusIcons = { running: '⏳', complete: '✅', failed: '❌', canceled: '🚫', blocked: '⛔', interrupted: '⏸️' };
  let html = `<div style="margin-bottom:12px"><b>需求：</b>${escHtml(session.task || '')}</div>`;
  if (runs.length) {
    html += '<div style="font-size:12px;color:var(--muted-2);margin-bottom:8px">执行记录：</div>';
    html += runs.map(r => {
      const tokens = (r.nodeStates ? Object.values(r.nodeStates).reduce((a, ns) => a + (ns.tokenUsage?.totalTokens || 0), 0) : 0);
      const cost = (r.nodeStates ? Object.values(r.nodeStates).reduce((a, ns) => a + (ns.tokenUsage?.costYuan || 0), 0) : 0);
      return `<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:6px;font-size:12px">
        <div>${statusIcons[r.status] || '⏳'} ${r.id} <span style="color:var(--muted-2)">${r.status}</span></div>
        <div style="color:var(--muted-2);margin-top:4px">Token: ${formatNumber(tokens)} · ¥${cost.toFixed(4)}</div>
      </div>`;
    }).join('');
  }
  // Show in node detail modal
  $('#node-detail-title').textContent = '会话详情';
  $('#node-detail-body').innerHTML = html;
  $('#node-detail-modal').style.display = 'flex';
}

// ── Utilities ──
function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function formatNumber(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}

function formatDuration(ms) {
  if (typeof ms === 'string') return ms;
  if (ms >= 60000) return (ms / 60000).toFixed(1) + 'm';
  if (ms >= 1000) return (ms / 1000).toFixed(1) + 's';
  return ms + 'ms';
}

// ── Load chat history on startup ──
async function loadChatHistory() {
  await refreshChatHistory();
}

// ── Init ──
async function init() {
  console.log('[init] starting...');
  connectSSE();
  console.log('[init] connectSSE called');
  try { await loadPresets(); } catch (e) { console.error('[init] loadPresets failed:', e); }
  try { await loadNodeTypes(); } catch (e) { console.error('[init] loadNodeTypes failed:', e); }
  // Try to load orchestration session from URL or localStorage
  const urlParams = new URLSearchParams(window.location.search);
  state.sessionID = urlParams.get('session') || localStorage.getItem('orchestrator-session-id') || null;
  try {
    // Resolve URL/localStorage through the session index first. A stale ID is
    // reported instead of silently switching to another historical session.
    await loadPreferredOrchestrationSession(state.sessionID || '');
  } catch (e) {
    console.warn('[init] no orchestration sessions found:', e);
  }
  try {
    // The orchestration transcript is authoritative for this UI. Only use the
    // native controller history when no orchestration conversation exists.
    const hasOrchestrationConversation = state.sessionID &&
      Array.isArray(state.chatMessages) && state.chatMessages.length > 0;
    if (!hasOrchestrationConversation) await loadChatHistory();
  } catch (e) { console.warn('[init] loadChatHistory:', e); }
  try { loadStats(); } catch (e) { console.error('[init] loadStats failed:', e); }
  try { loadAgents(); } catch (e) { console.error('[init] loadAgents failed:', e); }
  try { loadRuns(); } catch (e) { console.error('[init] loadRuns failed:', e); }
  console.log('[init] done');
}

document.addEventListener('DOMContentLoaded', init);
</script>
