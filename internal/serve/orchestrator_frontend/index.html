// ── Config panel ──
function showConfig(nodeId) {
  const node = state.nodes.find(n => n.id === nodeId);
  if (!node) return;
  state.selectedNode = nodeId;
  configPanel.classList.remove('config--hidden');
  $('#app').classList.remove('app--no-config');
  configEmpty.classList.add('hidden');
  configFields.classList.remove('hidden');
  configTitle.textContent = '节点: ' + node.name;
  $('#cfg-name').value = node.name;
  $('#cfg-type').value = node.type;
  $('#cfg-model').value = node.model || '';
  $('#cfg-agent').value = node.agent || '';
  $('#cfg-skill').value = node.skill || '';
  $('#cfg-executor').value = node.executor || 'reasonix';
  $('#cfg-mode').value = node.mode || 'serve';
  $('#cfg-role').value = node.role || '';
  syncConfigFieldState(node);
  // highlight node
  $$('.node').forEach(n => n.classList.remove('node--selected'));
  const el = document.getElementById('node-' + nodeId);
  if (el) el.classList.add('node--selected');
}

function hideConfig() {
  state.selectedNode = null;
  configPanel.classList.add('config--hidden');
  $('#app').classList.add('app--no-config');
  $$('.node').forEach(n => n.classList.remove('node--selected'));
}

$('#config-close').addEventListener('click', hideConfig);

// Config field change handlers
['cfg-name', 'cfg-type', 'cfg-model', 'cfg-agent', 'cfg-skill', 'cfg-executor', 'cfg-mode', 'cfg-role', 'cfg-reasoning-effort'].forEach(id => {
  const el = $('#' + id);
  el.addEventListener('change', () => {
    if (!state.selectedNode) return;
    const node = state.nodes.find(n => n.id === state.selectedNode);
    if (!node) return;
    if (id === 'cfg-name') { node.name = el.value; configTitle.textContent = '节点: ' + el.value; }
    if (id === 'cfg-type') node.type = el.value;
    if (id === 'cfg-model') {
      if (el.value === '__custom__') {
        const custom = (window.prompt('输入模型名：ccs/ccswitch 走 ccswitch 路由；其他（如 deepseek-xxx、claude 全名）将透传给 CLI 自行解析。', node.model || '') || '').trim();
        node.model = custom || node.model || '';
        if (['ccs', 'ccswitch'].includes(String(node.model).toLowerCase())) {
          node.model = 'ccs';
          node.providerRoute = 'ccswitch';
        } else if (node.executor === 'codex' || node.executor === 'claude') {
          node.providerRoute = '';
        }
        $('#cfg-model').value = node.model;
        render();
        return;
      }
      node.model = el.value;
      if (['codex', 'claude'].includes(node.executor) && ['ccs', 'ccswitch'].includes(String(node.model).toLowerCase())) {
        node.model = 'ccs';
        node.providerRoute = 'ccswitch';
      } else if (node.executor === 'codex' || node.executor === 'claude') {
        node.providerRoute = '';
      }
      if (!modelSupportsExecutor(node.model, node.executor || 'reasonix')) {
        const typeInfo = state.nodeTypes.find(t => t.type === node?.type);
        node.executor = (typeInfo?.executors || []).find(ex => modelSupportsExecutor(node.model, ex)) || inferExecutorFromModel(node.model);
      }
      if (!isMimoModel(node.model)) {
        node.agent = '';
      }
    }
    if (id === 'cfg-agent') node.agent = el.value;
    if (id === 'cfg-skill') node.skill = el.value;
    if (id === 'cfg-executor') {
      node.executor = el.value;
      if ((node.executor === 'codex' || node.executor === 'claude') && !node.model) {
        node.model = 'ccs';
        node.providerRoute = 'ccswitch';
      }
      if (!modelSupportsExecutor(node.model, el.value)) {
        const nextModel = firstCompatibleModelForNode(node, el.value);
        if (!nextModel) {
          toast('当前节点类型没有可用于该执行器的模型', 'error');
          showConfig(node.id);
          return;
        }
        node.model = nextModel;
      }
    }
    if (id === 'cfg-mode') node.mode = el.value;
    if (id === 'cfg-role') node.role = el.value;
    if (id === 'cfg-reasoning-effort') node.reasoningEffort = el.value;
    enforceNodeConstraints(node);
    syncConfigFieldState(node);
    showConfig(node.id);
    renderNodes();
  });
  if (id === 'cfg-name' || id === 'cfg-role') {
    el.addEventListener('input', () => {
      if (!state.selectedNode) return;
      const node = state.nodes.find(n => n.id === state.selectedNode);
      if (!node) return;
      if (id === 'cfg-name') { node.name = el.value; configTitle.textContent = '节点: ' + el.value; }
      if (id === 'cfg-role') node.role = el.value;
      renderNodes();
    });
  }
});

// ── Node management ──
function createNode(type, x, y) {
  const typeNames = { architect: '架构师', reviewer: '审查者', executor: '执行者' };
  const node = {
    id: state.nextNodeId++,
    name: typeNames[type] + '-' + state.nextNodeId,
    type: type,
    model: '',
    agent: '',
    skill: '',
    executor: type === 'executor' ? 'mimo' : 'reasonix',
    mode: 'serve',
    role: '',
    x: x,
    y: y,
    status: 'idle',
  };
  enforceNodeConstraints(node);
  state.nodes.push(node);
  renderNodes();
  return node;
}

function deleteNode(id) {
  state.nodes = state.nodes.filter(n => n.id !== id);
  state.edges = state.edges.filter(e => e.from !== id && e.to !== id);
  if (state.selectedNode === id) hideConfig();
  syncLoopConfigUI();
  renderNodes();
  renderEdges();
}

$('#add-node-pro').addEventListener('click', () => createNode('architect', 60 + Math.random() * 200, 60 + Math.random() * 200));
$('#add-node-flash').addEventListener('click', () => createNode('reviewer', 60 + Math.random() * 200, 60 + Math.random() * 200));
$('#add-node-mimo').addEventListener('click', () => createNode('executor', 60 + Math.random() * 200, 60 + Math.random() * 200));
$('#btn-delete-node').addEventListener('click', () => { if (state.selectedNode) deleteNode(state.selectedNode); });
$('#btn-clear-pipeline').addEventListener('click', () => {
  if (!confirm('确定清空管道？')) return;
  state.nodes = []; state.edges = []; state.nextNodeId = 1;
  hideConfig(); syncLoopConfigUI(); renderNodes(); renderEdges();
});

// ── Render nodes on canvas ──
function renderNodes() {
  console.log('[nodes] rendering', state.nodes.length, 'nodes, canvas visible:', canvas.offsetParent !== null, 'canvas dims:', canvas.offsetWidth, 'x', canvas.offsetHeight);
  canvas.querySelectorAll('.node').forEach(n => n.remove());
  state.nodes.forEach(node => {
    const el = document.createElement('div');
    el.id = 'node-' + node.id;
    el.className = 'node node--' + node.type;
    if (node.status === 'running') el.classList.add('node--running');
    if (node.status === 'done') el.classList.add('node--done');
    if (node.status === 'failed') el.classList.add('node--failed');
    if (node.status === 'interrupted') el.classList.add('node--interrupted');
    if (node.id === state.selectedNode) el.classList.add('node--selected');
    el.style.left = node.x + 'px';
    el.style.top = node.y + 'px';
    const typeLabel = { architect: '架构师', executor: '执行者', reviewer: '审查者' }[node.type] || node.type;
    el.innerHTML = `
      <div class="node__port node__port--in" data-port="in" data-node="${node.id}"></div>
      <div class="node__port node__port--out" data-port="out" data-node="${node.id}"></div>
      <div class="node__head">
        <span class="node__type-badge node__type-badge--${node.type}">${typeLabel}</span>
        <span class="node__name">${escHtml(node.name)}</span>
        <span class="node__status node__status--${node.status}"></span>
        <span class="node__detail-btn" data-node-id="${node.id}" title="查看详情">ℹ</span>
      </div>
      <div class="node__body">
        <div class="node__model">${escHtml(node.model || '未选择模型')}</div>
        <div class="node__skill">${escHtml(node.executor === 'mimo' ? (node.agent || '默认 Agent') : (node.skill || '无 Skill'))}</div>
      </div>
    `;
    // Drag handling
    el.addEventListener('mousedown', e => {
      if (e.target.classList.contains('node__port')) return;
      e.preventDefault();
      state.draggingNode = node.id;
      const rect = el.getBoundingClientRect();
      state.dragOffset.x = e.clientX - rect.left;
      state.dragOffset.y = e.clientY - rect.top;
      el.style.cursor = 'grabbing';
      showConfig(node.id);
    });
    // Double-click to show node detail
    el.addEventListener('dblclick', e => {
      if (e.target.classList.contains('node__port')) return;
      e.preventDefault();
      showNodeDetail(node);
    });
    // Detail button click
    el.querySelector('.node__detail-btn').addEventListener('click', e => {
      e.stopPropagation();
      showNodeDetail(node);
    });
    // Port connection
    el.querySelectorAll('.node__port').forEach(port => {
      port.addEventListener('mousedown', e => {
        e.preventDefault();
        e.stopPropagation();
        const portType = port.dataset.port;
        if (portType === 'out') {
          state.connectingFrom = node.id;
          // Create temp edge line
          const svg = svgEdges;
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          line.id = 'temp-edge';
          line.setAttribute('stroke', 'var(--accent)');
          line.setAttribute('stroke-width', '2');
          line.setAttribute('stroke-dasharray', '6 4');
          line.setAttribute('fill', 'none');
          svg.appendChild(line);
        }
      });
      port.addEventListener('mouseup', e => {
        e.stopPropagation();
        const portType = port.dataset.port;
        if (portType === 'in' && state.connectingFrom && state.connectingFrom !== node.id) {
          // Check for duplicate
          const exists = state.edges.some(ed => ed.from === state.connectingFrom && ed.to === node.id);
          if (!exists) {
            state.edges.push({
              from: state.connectingFrom,
              to: node.id,
            });
            renderEdges();
          }
        }
        cancelConnect();
      });
    });
    // Port badge for serve runtime — show for starting/ready/idle/busy, gray for stopped/error
    if (node.runtime && node.runtime.port) {
      const badge = document.createElement('div');
      badge.className = 'node__port-badge';
      badge.textContent = ':' + node.runtime.port;
      const s = node.runtime.status;
      const isRuntimeConsole = node.runtime.accessMode === 'runtime_console';
      const isActive = s === 'starting' || s === 'ready' || s === 'idle' || s === 'busy';
      // Codex app-server uses an internal WebSocket protocol. Never navigate the browser
      // to that endpoint: its output and controls are exposed through the Orchestrator console.
      const canOpenConsole = isRuntimeConsole && !!node.runtime.runtimeID;
      const canOpenBrowser = isActive && node.runtime.endpoint && node.runtime.executor !== 'mimo' && !isRuntimeConsole;
      badge.style.background = s === 'ready' ? 'var(--success)' :
                               s === 'idle' ? '#e6a800' :
                               s === 'busy' ? 'var(--accent)' :
                               s === 'starting' ? '#e6a800' :
                               'var(--muted-2)';
      badge.title = canOpenConsole ? (s === 'stopped' ? '打开已停止 Runtime 的控制台记录' : '打开 Orchestrator Runtime Console') :
                    s === 'starting' ? 'Runtime 正在启动，点击可提前打开' :
                    canOpenBrowser ? '点击打开 agent 页面' :
                    (s === 'stopped' ? 'Runtime 已停止' : 'Runtime 不可用');
      if (canOpenConsole) {
        badge.addEventListener('click', (e) => {
          e.stopPropagation();
          openRuntimeConsole(node.runtime.runtimeID);
        });
      } else if (canOpenBrowser) {
        badge.addEventListener('click', (e) => {
          e.stopPropagation();
          window.open(node.runtime.endpoint, '_blank');
        });
      }
      el.appendChild(badge);
    }
    canvas.appendChild(el);
  });
}

function cancelConnect() {
  state.connectingFrom = null;
  const temp = document.getElementById('temp-edge');
  if (temp) temp.remove();
}

// Global mouse handlers for drag and connect
document.addEventListener('mousemove', e => {
  if (state.draggingNode) {
    const node = state.nodes.find(n => n.id === state.draggingNode);
    if (!node) return;
    const wrapRect = canvasWrap.getBoundingClientRect();
    const scrollLeft = canvasWrap.scrollLeft;
    const scrollTop = canvasWrap.scrollTop;
    node.x = e.clientX - wrapRect.left + scrollLeft - state.dragOffset.x;
    node.y = e.clientY - wrapRect.top + scrollTop - state.dragOffset.y;
    node.x = Math.max(0, node.x);
    node.y = Math.max(0, node.y);
    const el = document.getElementById('node-' + node.id);
    if (el) { el.style.left = node.x + 'px'; el.style.top = node.y + 'px'; }
    renderEdges();
  }
  if (state.connectingFrom) {
    const fromNode = state.nodes.find(n => n.id === state.connectingFrom);
    if (!fromNode) return;
    const wrapRect = canvasWrap.getBoundingClientRect();
    const x1 = fromNode.x + 180;
    const y1 = fromNode.y + 40;
    const x2 = e.clientX - wrapRect.left + canvasWrap.scrollLeft;
    const y2 = e.clientY - wrapRect.top + canvasWrap.scrollTop;
    const temp = document.getElementById('temp-edge');
    if (temp) {
      temp.setAttribute('d', calcEdgePath(x1, y1, x2, y2));
    }
  }
});

document.addEventListener('mouseup', () => {
  if (state.draggingNode) {
    const el = document.getElementById('node-' + state.draggingNode);
    if (el) el.style.cursor = 'grab';
    state.draggingNode = null;
  }
  cancelConnect();
});

// Click on canvas to deselect
canvasWrap.addEventListener('click', e => {
  if (e.target === canvasWrap || e.target === canvas) {
    hideConfig();
  }
});

// ── Edge rendering ──
function calcEdgePath(x1, y1, x2, y2) {
  const dx = Math.abs(x2 - x1) * 0.5;
  return `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
}

function renderEdges() {
  // Remove old edges (keep defs and temp)
  svgEdges.querySelectorAll('.edge-group').forEach(g => g.remove());
  state.edges.forEach((edge, i) => {
    const fromNode = state.nodes.find(n => n.id === edge.from);
    const toNode = state.nodes.find(n => n.id === edge.to);
    if (!fromNode || !toNode) return;
    const x1 = fromNode.x + 180;
    const y1 = fromNode.y + 40;
    const x2 = toNode.x;
    const y2 = toNode.y + 40;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('edge-group');
    g.dataset.edgeIdx = i;
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', calcEdgePath(x1, y1, x2, y2));
    path.setAttribute('marker-end', 'url(#arrowhead)');
    path.style.pointerEvents = 'stroke';
    path.style.cursor = 'pointer';
    path.addEventListener('click', e => {
      e.stopPropagation();
      if (confirm('删除此连线？')) {
        state.edges.splice(i, 1);
        renderEdges();
      }
    });
    g.appendChild(path);
    // Flow animation dot
    if (edge.flowing) {
      path.classList.add('edge--flowing');
      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.classList.add('flow-dot');
      circle.setAttribute('r', '3');
      const anim = document.createElementNS('http://www.w3.org/2000/svg', 'animateMotion');
      anim.setAttribute('dur', '1.5s');
      anim.setAttribute('repeatCount', 'indefinite');
      anim.setAttribute('path', calcEdgePath(x1, y1, x2, y2));
      circle.appendChild(anim);
      g.appendChild(circle);
    }
    g.appendChild(path);
    svgEdges.appendChild(g);
  });
  renderLoopOverlay();
}

// Loop is a runtime repetition of the same base DAG. Do not add a real edge
// back into state.edges: that would turn the execution graph into a cycle and
// make the backend topological scheduler reject it. This overlay is visual
// only, so the Canvas explains the loop without changing execution semantics.
function renderLoopOverlay() {
  svgEdges.querySelectorAll('.loop-overlay').forEach(g => g.remove());
  const cfg = getLoopConfig();
  if (!cfg.enabled || !cfg.reviewNodeID) return;
  const reviewer = state.nodes.find(n => String(n.id) === String(cfg.reviewNodeID));
  if (!reviewer) return;
  const target = state.nodes.find(n => n.type === 'executor') || state.nodes.find(n => n.type !== 'architect');
  if (!target || target.id === reviewer.id) return;

  const pad = 22;
  const minX = Math.min(...state.nodes.map(n => n.x)) - pad;
  const minY = Math.min(...state.nodes.map(n => n.y)) - pad;
  const maxX = Math.max(...state.nodes.map(n => n.x + 180)) + pad;
  const maxY = Math.max(...state.nodes.map(n => n.y + 80)) + pad;
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  g.classList.add('loop-overlay');

  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.classList.add('loop-boundary');
  rect.setAttribute('x', minX);
  rect.setAttribute('y', minY);
  rect.setAttribute('width', Math.max(0, maxX - minX));
  rect.setAttribute('height', Math.max(0, maxY - minY));
  rect.setAttribute('rx', 12);
  g.appendChild(rect);

  const startX = reviewer.x + 90;
  const startY = reviewer.y + 80;
  const endX = target.x + 90;
  const endY = target.y;
  const loopY = maxY + 28;
  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.classList.add('loopback');
  path.setAttribute('d', `M ${startX} ${startY} C ${startX} ${loopY}, ${endX} ${loopY}, ${endX} ${endY}`);
  path.setAttribute('marker-end', 'url(#loop-arrowhead)');
  g.appendChild(path);

  const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  label.classList.add('loop-label');
  label.setAttribute('x', minX + 12);
  label.setAttribute('y', minY + 18);
  const max = cfg.mode === 'fixed' ? (cfg.fixedIterations || cfg.maxIterations || 0) : (cfg.maxIterations || 0);
  label.textContent = `Loop 运行时回到执行者 · ${cfg.mode} · ${max} 轮`;
  g.appendChild(label);
  svgEdges.appendChild(g);
}

// ── Auto layout ──
$('#btn-auto-layout').addEventListener('click', () => {
  if (state.nodes.length === 0) return;
  // Simple left-to-right topological layout
  const levels = {};
  const visited = new Set();
  function getLevel(id) {
    if (levels[id] !== undefined) return levels[id];
    const incoming = state.edges.filter(e => e.to === id);
    if (incoming.length === 0) { levels[id] = 0; return 0; }
    let maxL = 0;
    incoming.forEach(e => { maxL = Math.max(maxL, getLevel(e.from) + 1); });
    levels[id] = maxL;
    return maxL;
  }
  state.nodes.forEach(n => getLevel(n.id));
  const byLevel = {};
  state.nodes.forEach(n => {
    const l = levels[n.id] || 0;
    if (!byLevel[l]) byLevel[l] = [];
    byLevel[l].push(n);
  });
  Object.keys(byLevel).forEach(l => {
    byLevel[l].forEach((n, i) => {
      n.x = 60 + parseInt(l) * 240;
      n.y = 40 + i * 120;
    });
  });
  renderNodes();
  renderEdges();
});

// ── Chat ──
function addChatMessage(role, text, meta, persist = true) {
  chatWelcome.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'chat-bubble chat-bubble--' + role;
  div.innerHTML = `
    <div class="chat-bubble__inner">${escHtml(text)}</div>
    ${meta ? `<div class="chat-bubble__meta">${escHtml(meta)}</div>` : ''}
  `;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  if (!persist) return;
  state.chatMessages.push({ role, text, meta });
  // Categorize: requirement messages vs pipeline logs
  const isPipelineLog = meta === '流水线' || meta === '工具' || meta === '工具结果' || meta === '通知';
  if (role === 'user' || (!isPipelineLog && meta !== '分析中' && meta !== '错误')) {
    state.requirementMessages.push({ role, text, meta });
  } else {
    state.pipelineMessages.push({ role, text, meta });
  }
}

async function refreshChatHistory() {
  try {
    const msgs = await mainApi('GET', '/history');
    chatMessages.innerHTML = '';
    state.chatMessages = [];
    state.requirementMessages = [];
    state.pipelineMessages = [];
    if (!Array.isArray(msgs) || msgs.length === 0) {
      chatWelcome.style.display = '';
      return;
    }
    for (const m of msgs) {
      if (!m || !m.role || m.role === 'system' || m.role === 'tool') continue;
      const role = m.role === 'assistant' ? 'ai' : m.role;
      const text = [m.reasoning, m.content].filter(Boolean).join(m.reasoning && m.content ? '\n\n' : '');
      addChatMessage(role, text || '', m.toolName || m.toolCallId || '');
    }
  } catch (err) {
    console.warn('refreshChatHistory failed:', err);
  }
}

async function loadOrchestrationConversation(sessionID) {
  if (!sessionID) return false;
  const data = await apiGet('/orch-sessions/' + sessionID + '/conversation');
  chatMessages.innerHTML = '';
  state.chatMessages = [];
  state.requirementMessages = data.requirementMessages || [];
  state.pipelineMessages = data.pipelineMessages || [];
  const messages = data.chatMessages || [];
  if (messages.length === 0) {
    chatWelcome.style.display = '';
    return true;
  }
  chatWelcome.style.display = 'none';
  for (const m of messages) {
    addChatMessage(m.role, m.text || '', m.meta || '', false);
    state.chatMessages.push({ role: m.role, text: m.text || '', meta: m.meta || '' });
  }
  return true;
}

// Models may identify a step through agent/type/role/name/label and often add
// a round suffix (for example "架构师2"). Keep one canonical classifier for
// Loop normalization and Canvas materialization; otherwise the normalizer can
// collapse the graph but the Canvas type mapper may turn "架构师1" into a
// reviewer by falling through to its default.
function generatedStepRoleKey(step) {
  const raw = String(step?.agent || step?.type || step?.role || step?.name || step?.label || '').trim().toLowerCase();
  if (/审查者|审查|reviewer|review/.test(raw)) return 'reviewer';
  if (/架构师|architect/.test(raw)) return 'architect';
  if (/执行者|executor|implementer|developer/.test(raw)) return 'executor';
  return raw.replace(/[0-9一二三四五六七八九十]+$/g, '');
}

function generatedStepNodeType(step) {
  const role = generatedStepRoleKey(step);
  if (role === 'architect' || role === 'executor' || role === 'reviewer') return role;
  return 'reviewer';
}

function normalizeGeneratedLoopAnalysis(analysis, sourceText = '') {
  if (!analysis || !Array.isArray(analysis.steps)) return analysis;
  const loopRequested = !!(analysis.loopConfig && analysis.loopConfig.enabled) ||
    /循环|loop|迭代|反复执行|重复执行|审查后修改|直到.*通过|最多.*轮/i.test(sourceText);
  if (!loopRequested) return analysis;
  const steps = analysis.steps;
  const isReviewer = step => generatedStepRoleKey(step) === 'reviewer';
  const reviewerIndexes = steps
    .map((step, index) => isReviewer(step) ? index : -1)
    .filter(index => index >= 0);
  if (reviewerIndexes.length <= 1) {
    if (reviewerIndexes.length === 1 && loopRequested) {
      const reviewer = steps[reviewerIndexes[0]];
      return {
        ...analysis,
        loopConfig: {
          ...(analysis.loopConfig || {}),
          enabled: true,
          mode: analysis.loopConfig?.mode || 'review_decides',
          maxIterations: Number(analysis.loopConfig?.maxIterations || 3),
          reviewNodeID: analysis.loopConfig?.reviewNodeID || reviewer.id,
          protocol: 'loop-review-v1',
        },
      };
    }
    return analysis;
  }

  // The common malformed output is [architect, executor, reviewer] repeated
  // N times. Only collapse when every chunk has exactly the same role pattern;
  // otherwise do not guess and disable Loop so the user can correct the graph.
  const firstRoundEnd = reviewerIndexes[0] + 1;
  const firstRound = steps.slice(0, firstRoundEnd);
  const pattern = firstRound.map(step => generatedStepRoleKey(step));
  let cursor = 0;
  let repeated = true;
  let rounds = 0;
  while (cursor < steps.length) {
    const chunk = steps.slice(cursor, cursor + pattern.length);
    if (chunk.length !== pattern.length || chunk.some((step, i) => generatedStepRoleKey(step) !== pattern[i])) {
      repeated = false;
      break;
    }
    cursor += pattern.length;
    rounds++;
  }
  if (!repeated || rounds < 2 || cursor !== steps.length) {
    return {
      ...analysis,
      loopConfig: { enabled: false },
      suggestion: (analysis.suggestion || '') + '\n⚠️ 检测到多个审查者，无法安全收缩为一个 Loop；已关闭 Loop，请在 Canvas 保留一组基础节点。',
    };
  }

  const keptIDs = new Set(firstRound.map(step => String(step.id)));
  const edges = (analysis.edges || []).filter(edge => keptIDs.has(String(edge.from)) && keptIDs.has(String(edge.to)));
  return {
    ...analysis,
    // Canonicalize the role discriminator while preserving the model's
    // descriptive fields, so Canvas creation is deterministic.
    steps: firstRound.map(step => ({
      ...step,
      agent: generatedStepRoleKey(step),
    })),
    edges,
    loopConfig: {
      ...analysis.loopConfig,
      enabled: true,
      reviewNodeID: firstRound[firstRound.length - 1].id,
      protocol: 'loop-review-v1',
      maxIterations: Number(analysis.loopConfig.maxIterations || 3),
    },
    suggestion: (analysis.suggestion || '') + `\n✅ 已将模型展开的 ${rounds} 组节点收缩为一组基础节点，Loop 将在运行时重复执行。`,
  };
}

async function sendChat() {
  const text = chatInput.value.trim();
  if (!text) return;
  chatInput.value = '';
  addChatMessage('user', text);

  // Ensure we have an orchestration session
  if (!state.sessionID) {
    try {
      const sess = await apiPost('/orch-sessions', { title: text.substring(0, 50) });
      state.sessionID = sess.id;
      state.pipelineHydrated = true;
      state.pipelineRevisionID = '';
      state.pipelineId = null;
      state.loadedLoopConfig = { enabled: false };
      state.loopConfigDirty = false;
      localStorage.setItem('orchestrator-session-id', state.sessionID);
      console.log('[orch:init] created session id:', sess.id);
    } catch (e) {
      console.warn('failed to create orchestration session:', e);
    }
  }

  // Save requirement message to session
  if (state.sessionID) {
    try { await saveOrchestratorState(state.sessionID); } catch (e) { /* ignore */ }
  }

  // 构建需求对话历史（仅用户消息 + Flash 分析，不含流水线日志）
  const history = state.requirementMessages
    .filter(m => m.role === 'user' || (m.role === 'ai' && m.meta !== '分析中'))
    .map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.text }));

  // 如果已有流水线，附加当前配置信息让Flash知道
  let pipelineInfo = '';
  if (state.nodes.length > 0) {
    pipelineInfo = '\n\n当前已配置的流水线节点：\n';
    state.nodes.forEach((n, i) => {
      pipelineInfo += `${i + 1}. ${n.name} (${n.type}, ${n.model || '未指定'}) — ${n.role || '未设置职责'}\n`;
    });
  }

  try {
    addChatMessage('ai', '⏳ 正在分析需求...', '分析中');
    const analysis = await apiPost('/requirements/analyze', { text, history, pipelineInfo });
    console.log('[sendChat] analysis result:', JSON.stringify(analysis).substring(0, 500));
    // Loop is a runtime repetition of one base DAG. If the model still
    // expands identical rounds, collapse only an unambiguous repeated
    // role-pattern before drawing the Canvas.
    const normalizedAnalysis = normalizeGeneratedLoopAnalysis(analysis, text);
    if (normalizedAnalysis !== analysis) {
      console.warn('[sendChat] collapsed expanded Loop analysis to one base DAG');
    }
    const generated = normalizedAnalysis;
    // 移除"分析中"消息
    const msgs = chatMessages.querySelectorAll('.chat-bubble--ai');
    const lastMsg = msgs[msgs.length - 1];
    if (lastMsg && lastMsg.textContent.includes('分析中')) lastMsg.remove();

    // 显示分析结果
    if (generated.analysis) {
      addChatMessage('ai', '📋 **需求分析**\n\n' + generated.analysis, 'Flash');
    }

    // 保存改写后的需求（供确认弹窗使用）
    if (generated.rewritten) {
      state.rewrittenTask = generated.rewritten;
      addChatMessage('ai', '📝 **需求已改写**\n\n' + generated.rewritten, 'Flash');
    }

    // 自动配置流水线节点和DAG拓扑
    console.log('[sendChat] steps:', generated.steps, 'edges:', generated.edges);
    if (generated.steps && generated.steps.length > 0) {
      state.nodes = [];
      state.edges = [];
      state.nextNodeId = 1;

      // 步骤1：创建节点，记录 stepId → nodeId 映射
      const stepIdMap = {};
      for (const step of generated.steps) {
        const nodeType = generatedStepNodeType(step);
        const node = createNode(nodeType, 0, 0);
        node.name = step.agent;
        node.role = step.roleDesc;
        node.model = step.model || '';
        node.executor = step.executor || 'reasonix';
        node.mode = step.mode || 'serve';
        node.agent = step.agentProfile || '';
        node.skill = canonicalSkillForNode(step.skill || '', nodeType, text, step.roleDesc || step.step || '');
        enforceNodeConstraints(node);
        stepIdMap[step.id] = node.id;
      }

      // 步骤2：根据 edges 创建连接
      if (generated.edges && generated.edges.length > 0) {
        for (const edge of generated.edges) {
          const fromId = stepIdMap[edge.from];
          const toId = stepIdMap[edge.to];
          if (fromId !== undefined && toId !== undefined) {
            state.edges.push({ from: fromId, to: toId });
          }
        }
      } else {
        // 无 edges 时退化为串行
        for (let i = 1; i < state.nodes.length; i++) {
          state.edges.push({ from: state.nodes[i - 1].id, to: state.nodes[i].id });
        }
      }

      // Loop 配置只引用这一轮基础 DAG 中唯一的 Reviewer。
      if (generated.loopConfig && generated.loopConfig.enabled) {
        const reviewerSteps = generated.steps.filter(s => generatedStepRoleKey(s) === 'reviewer');
        const reviewStepID = generated.loopConfig.reviewNodeID || (reviewerSteps.length === 1 ? reviewerSteps[0].id : '');
        const reviewNodeID = reviewStepID !== '' ? stepIdMap[reviewStepID] : undefined;
        if (reviewNodeID !== undefined && reviewerSteps.length === 1) {
          restoreLoopConfigUI({
            ...generated.loopConfig,
            enabled: true,
            reviewNodeID: String(reviewNodeID),
            protocol: 'loop-review-v1',
          });
        } else {
          restoreLoopConfigUI({ enabled: false });
          generated.suggestion = (generated.suggestion || '') + '\n⚠️ Loop 必须且只能有一个审查者节点，已保持关闭。';
        }
      } else {
        restoreLoopConfigUI({ enabled: false });
      }

      // 步骤3：拓扑布局（按层级排列）
      layoutPipeline();

      renderNodes();
      renderEdges();

      // 显示配置摘要
      let configMsg = '✅ 已自动配置流水线（' + state.edges.length + ' 条连接）：\n';
      generated.steps.forEach((s, i) => {
        configMsg += `${i + 1}. **${s.agent}** — ${s.roleDesc}\n`;
      });
      if (generated.suggestion) {
        configMsg += '\n💡 ' + generated.suggestion;
      }
      addChatMessage('ai', configMsg, '配置建议');

      switchPanel('pipeline');
      toast('流水线已自动配置', 'success');
    }
    // Persist the rewritten requirement and the generated pipeline together.
    // Saving earlier and again after node generation creates two racing PUTs;
    // the older request can overwrite the freshly analyzed task.
    if (state.sessionID) await saveOrchestratorState(state.sessionID);
  } catch (err) {
    addChatMessage('ai', '分析失败: ' + err.message, '错误');
  }
}

// 拓扑布局：计算每个节点的层级，同层垂直排列，不同层水平排列
function layoutPipeline() {
  if (state.nodes.length === 0) return;
  // 计算入度
  const inDeg = {};
  const adj = {};
  state.nodes.forEach(n => { inDeg[n.id] = 0; adj[n.id] = []; });
  state.edges.forEach(e => {
    adj[e.from].push(e.to);
    inDeg[e.to]++;
  });
  // BFS 分层
  const levels = {};
  const queue = [];
  state.nodes.forEach(n => {
    if (inDeg[n.id] === 0) { levels[n.id] = 0; queue.push(n.id); }
  });
  while (queue.length > 0) {
    const u = queue.shift();
    for (const v of adj[u]) {
      inDeg[v]--;
      if (levels[v] === undefined || levels[v] < levels[u] + 1) {
        levels[v] = levels[u] + 1;
      }
      if (inDeg[v] === 0) queue.push(v);
    }
  }
  // 按层级分组
  const byLevel = {};
  state.nodes.forEach(n => {
    const l = levels[n.id] || 0;
    if (!byLevel[l]) byLevel[l] = [];
    byLevel[l].push(n);
  });
  // 放置
  const LEVEL_W = 250;
  const NODE_H = 80;
  Object.keys(byLevel).forEach(l => {
    const nodes = byLevel[l];
    const totalH = nodes.length * NODE_H;
    const startY = (200 - totalH) / 2;
    nodes.forEach((n, i) => {
      n.x = 60 + parseInt(l) * LEVEL_W;
      n.y = startY + i * (NODE_H + 40);
    });
  });
}

// 保存当前 orchestrator 状态到会话
async function saveOrchestratorState(sessionID) {
  if (!sessionID) return;
  // Never let an autosave from the previous canvas write into a session whose
  // pipeline is still being hydrated. The GET response is the source of truth
  // until it finishes; callers can retry after hydration completes.
  if (!state.pipelineHydrated) {
    console.debug('[orch:save] skipped while pipeline is hydrating', sessionID);
    return;
  }
  try {
    const nodes = state.nodes.map(n => ({
      id: String(n.id), name: n.name, type: n.type, model: n.model,
      agent: n.agent, skill: canonicalSkillForNode(n.skill || '', n.type, state.rewrittenTask || '', n.role || ''), mode: n.mode, executor: n.executor, role: n.role,
      x: n.x, y: n.y,
    }));
    const edges = state.edges.map((e, index) => ({ id: edgeId(e, index), from: String(e.from), to: String(e.to) }));
    const loopConfig = getLoopConfig();
    const payload = {
      name: state.pipelineName,
      nodes,
      edges,
      loopConfig,
      source: 'manual_edit'
    };
    if (state.pipelineRevisionID || state.pipelineId) {
      payload.baseRevisionID = state.pipelineRevisionID || state.pipelineId;
    }
    const revision = await apiPut('/orch-sessions/' + sessionID + '/pipelines/current', payload);
    if (!revision || !revision.id) throw new Error('服务端未返回 pipeline revision ID');
    state.pipelineId = revision.id;
    state.pipelineRevisionID = revision.id;
    state.loadedLoopConfig = normalizeLoopConfigForSave(revision.loopConfig || loopConfig);
    state.loopConfigDirty = false;
    await apiPut('/orch-sessions/' + sessionID + '/conversation', {
      chatMessages: state.chatMessages || [],
      requirementMessages: state.requirementMessages || [],
      pipelineMessages: state.pipelineMessages || []
    });
    // Update session title if we have a rewritten task
    if (state.rewrittenTask) {
      await apiPut('/orch-sessions/' + sessionID, {
        task: state.rewrittenTask,
        rewrittenTask: state.rewrittenTask
      });
    }
  } catch (err) {
    toast('保存失败: ' + err.message, 'error');
    throw err;
  }
}

// 加载会话的 orchestrator 状态
async function loadOrchestratorState(sessionID) {
  if (!sessionID) return;
  // Reset the hydration guard before changing the session binding. Any
  // autosave fired during the async GET must be ignored until this function
  // has installed the new canvas and its persisted LoopConfig.
  state.pipelineHydrated = false;
  state.pipelineRevisionID = '';
  state.pipelineId = null;
  state.nodes = [];
  state.edges = [];
  state.loadedLoopConfig = { enabled: false };
  state.loopConfigDirty = false;
  console.log('[orch:init] requested session id:', sessionID);
  try {
    // Try new API first
    let data;
    try {
      data = await apiGet('/orch-sessions/' + sessionID);
      console.log('[orch:init] loaded session id:', sessionID);
    } catch (e) {
      // A Reasonix history session predates OrchestrationSession. Migrate its
      // saved canvas once, then continue with the new session ID.
      if (!String(e.message || '').includes('404')) throw e;
      if (String(sessionID).startsWith('orchestrator-')) {
        if (state.sessionID === sessionID) state.sessionID = null;
        if (localStorage.getItem('orchestrator-session-id') === sessionID) {
          localStorage.removeItem('orchestrator-session-id');
        }
        return;
      }
      if (String(sessionID).startsWith('orch_')) {
        console.warn('[orch:init] orchestration session not found:', sessionID);
        if (state.sessionID === sessionID) state.sessionID = null;
        if (localStorage.getItem('orchestrator-session-id') === sessionID) {
          localStorage.removeItem('orchestrator-session-id');
        }
        return;
      }
      const legacy = await apiGet('/sessions/' + sessionID + '/state');
      const migrated = await migrateNativeSession(sessionID, sessionID);
      if (!migrated || !migrated.id) throw new Error('迁移旧会话失败：服务端未返回新会话 ID');
      state.sessionID = migrated.id;
      localStorage.setItem('orchestrator-session-id', state.sessionID);
      data = legacy || {};
      if (data.nodes || data.edges) {
        const revision = await apiPost('/orch-sessions/' + state.sessionID + '/pipelines', {
          nodes: data.nodes || [], edges: data.edges || [], source: 'migration',
          loopConfig: { enabled: false }
        });
        state.pipelineId = revision && revision.id;
        state.pipelineRevisionID = state.pipelineId || '';
      }
      if (data.rewrittenTask) {
        try { await apiPut('/orch-sessions/' + state.sessionID, { task: data.rewrittenTask }); } catch (_) {}
      }
      if (data.chatMessages || data.requirementMessages || data.pipelineMessages) {
        await apiPut('/orch-sessions/' + state.sessionID + '/conversation', {
          chatMessages: data.chatMessages || [],
          requirementMessages: data.requirementMessages || [],
          pipelineMessages: data.pipelineMessages || []
        });
      }
    }
    if (data) {
      // A session workspace is the authoritative UI value. The process-level
      // /cwd endpoint remains only a legacy compatibility mechanism.
      if (data.session && data.session.workspace) {
        cwdDisplay.textContent = data.session.workspace;
        cwdDisplay.title = data.session.workspace;
      }
      // Handle new API response format
      if (data.currentPipeline) {
        state.pipelineId = data.currentPipeline.id || null;
        state.pipelineRevisionID = state.pipelineId || '';
        if (data.currentPipeline.nodes) state.nodes = data.currentPipeline.nodes.map(normalizeNode);
        if (data.currentPipeline.edges) state.edges = data.currentPipeline.edges.map((e, index) => normalizeEdge(e, index));
        console.log('[orch:init] loaded pipeline revision id:', state.pipelineId, 'nodes:', state.nodes.length);
        // The persisted revision is authoritative. Do not mark this as a user
        // edit merely because the controls had to be populated.
        restoreLoopConfigUI(data.currentPipeline.loopConfig || { enabled: false }, { markDirty: false });
      } else if (data.nodes) {
        // Legacy format
        state.nodes = data.nodes.map(normalizeNode);
        state.edges = (data.edges || []).map((e, index) => normalizeEdge(e, index));
        state.pipelineRevisionID = state.pipelineId || '';
        restoreLoopConfigUI({ enabled: false }, { markDirty: false });
      } else {
        // A session without a revision must not retain the previous session's
        // canvas. The empty state is rendered below.
        state.nodes = [];
        state.edges = [];
        restoreLoopConfigUI({ enabled: false }, { markDirty: false });
      }
      state.loadedLoopConfig = normalizeLoopConfigForSave(
        data.currentPipeline?.loopConfig || { enabled: false }
      );
      if (data.session && data.session.requirementMessages) {
        state.requirementMessages = data.session.requirementMessages;
      }
      await loadOrchestrationConversation(state.sessionID);
      if (data.rewrittenTask || (data.session && data.session.rewrittenTask)) {
        state.rewrittenTask = data.rewrittenTask || (data.session && data.session.rewrittenTask) || '';
      }
      if (data.runtimeStates && typeof data.runtimeStates === 'object') {
        state.runtimeStates = data.runtimeStates;
      }
      state.nextNodeId = Math.max(1, ...state.nodes.map(n => Number(n.id) || 0)) + 1;
      backfillRuntimeToNodes();
      renderNodes();
      renderEdges();
      state.loopConfigDirty = false;
      state.pipelineHydrated = true;
    }
  } catch (err) {
    state.pipelineHydrated = false;
    if (String(err.message || '').includes('404')) {
      if (state.sessionID === sessionID) state.sessionID = null;
      if (localStorage.getItem('orchestrator-session-id') === sessionID) {
        localStorage.removeItem('orchestrator-session-id');
      }
      return;
    }
    console.warn('load orchestrator state failed:', err);
  }
}

async function loadPreferredOrchestrationSession(preferredID = '') {
  // Check the session index before requesting a specific session. A stale
  // localStorage/URL ID is common after the server data directory changes;
  // probing it first only creates a noisy 404 and delays loading the real
  // latest session.
  const sessions = await apiGet('/orch-sessions?limit=200');
  if (!Array.isArray(sessions) || sessions.length === 0) {
    if (preferredID && localStorage.getItem('orchestrator-session-id') === preferredID) {
      localStorage.removeItem('orchestrator-session-id');
    }
    if (state.sessionID === preferredID) state.sessionID = null;
    return false;
  }
  let selected;
  if (preferredID) {
    selected = sessions.find(s => s && s.id === preferredID);
    if (!selected) {
      // Do not silently switch to another session when the cached ID is stale.
      // That made a rebuild look like history had rolled back.
      if (localStorage.getItem('orchestrator-session-id') === preferredID) {
        localStorage.removeItem('orchestrator-session-id');
      }
      if (state.sessionID === preferredID) state.sessionID = null;
      toast('原编排会话不存在，请从历史记录中选择', 'error');
      return false;
    }
  } else {
    selected = sessions[0];
  }
  if (!selected || !selected.id) return false;
  state.sessionID = selected.id;
  localStorage.setItem('orchestrator-session-id', selected.id);
  await loadOrchestratorState(selected.id);
  return state.sessionID === selected.id;
}

async function loadLatestOrchestrationSession() {
  return loadPreferredOrchestrationSession('');
}

// ── SSE connection ──
function connectSSE() {
  if (state.sseConnection) { state.sseConnection.close(); }
  const ev = new EventSource('/orchestrator/api/events');
  state.sseConnection = ev;
  ev.onopen = () => {
    sseDot.classList.add('topbar__dot--live');
    sseStatus.textContent = '已连接';
  };
  ev.onerror = () => {
    sseDot.classList.remove('topbar__dot--live');
    sseStatus.textContent = '重连中...';
  };
  // Use onmessage to handle all event kinds (same pattern as main frontend)
  ev.onmessage = (evt) => {
    try {
      const e = JSON.parse(evt.data);
      switch (e.kind) {
        case 'text':
          handleChatStream({ delta: e.text || '' });
          break;
        case 'message':
          handleChatStream({ end: true });
          break;
        case 'turn_started':
          handleChatStream({ start: true });
          break;
        case 'turn_done':
          handleChatStream({ end: true });
          if (e.err) addChatMessage('ai', '错误: ' + e.err);
          break;
        case 'usage':
          if (e.usage) updateTokenStats(e.usage);
          break;
        case 'notice':
          if (e.text) addChatMessage('ai', e.text, '通知');
          break;
        case 'tool_dispatch':
          if (e.tool) addChatMessage('ai', '调用工具: ' + (e.tool.name || ''), '工具');
          break;
        case 'tool_result':
          if (e.tool && e.tool.output) {
            addChatMessage('ai', e.tool.output.substring(0, 500), '工具结果');
          }
          break;
        case 'pipeline_node_start':
          addChatMessage('ai', '⏳ ' + (e.text || '节点') + ' 开始执行...', '流水线');
          if (e.text) updateNodeStatus(e.text, 'running');
          break;
        case 'pipeline_node_done':
          addChatMessage('ai', '✅ ' + (e.text || '节点') + ' 完成\n' + (e.detail || '').substring(0, 500), '流水线');
          if (e.text) state.nodeOutputs[e.text] = { output: e.detail || '', status: 'done' };
          if (e.text) updateNodeStatus(e.text, 'done');
          break;
        case 'pipeline_node_failed':
          addChatMessage('ai', '❌ ' + (e.text || '节点') + ' 失败: ' + (e.detail || e.err || ''), '流水线');

          if (e.text) state.nodeOutputs[e.text] = { error: e.detail || e.err || '', status: 'failed' };
          if (e.text) updateNodeStatus(e.text, 'failed');
          break;
        case 'pipeline_node_runtime':
          if (e.text && e.detail) {
            try {
              const incomingRuntime = JSON.parse(e.detail);
              // 用 runtimeID 或 nodeID 匹配节点。启动事件可能只包含端口和状态，
              // 因此必须与已有的持久化 RuntimeState 合并，不能覆盖掉 accessMode、
              // runtimeID、Thread ID 等 Runtime Console 元数据。
              let node = null;
              if (incomingRuntime.nodeID) {
                node = state.nodes.find(n => String(n.id) === String(incomingRuntime.nodeID));
              }
              if (!node) {
                node = state.nodes.find(n => n.name === e.text);
              }
              const runtimeKey = incomingRuntime.runtimeID || (node ? ('node_' + node.id) : 'runtime_' + e.text);
              let previousRuntime = state.runtimeStates[runtimeKey] || (node && node.runtime) || {};
              if (node && !incomingRuntime.runtimeID) {
                // Node start/completion events omit runtimeID. They must not
                // erase the provider runtime identity: prefer the live
                // node.runtime when it carries one, otherwise recover the
                // runtimeID from runtimeStates by nodeID.
                if (node.runtime && node.runtime.runtimeID) {
                  previousRuntime = node.runtime;
                } else if (!previousRuntime.runtimeID) {
                  const byNode = Object.values(state.runtimeStates).find(rt => rt && rt.runtimeID && String(rt.nodeID) === String(node.id));
                  if (byNode) previousRuntime = byNode;
                }
              }
              const rt = { ...previousRuntime, ...incomingRuntime };
              if (node) {
                node.runtime = rt;
                // 同步到 runtimeStates
                state.runtimeStates[runtimeKey] = rt;
                renderNodes();
              }
              // Codex app-server events are proxied by the Orchestrator. The
              // payload is only a wake-up signal; the console fetches its
              // escaped event history from the API and never dials WebSocket directly.
              // Wake every open console window that belongs to this runtime.
              if (rt.runtimeID) {
                refreshRuntimeConsole(rt.runtimeID);
              }
            } catch (_) {}
          }
          break;
        case 'pipeline_done':
          addChatMessage('ai', '🎉 流水线执行完成！', '流水线');

          loadStats();
          autoSaveState();
          handlePipelineDone(e);
          break;
      }
    } catch (_) {}
  };
}

let streamTarget = null;
function ensureStreamTarget() {
  if (!streamTarget) {
    streamTarget = { el: null, text: '' };
    chatWelcome.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'chat-bubble chat-bubble--ai';
    div.innerHTML = '<div class="chat-bubble__inner"><span class="cursor"></span></div>';
    chatMessages.appendChild(div);
    streamTarget.el = div.querySelector('.chat-bubble__inner');
  }
  return streamTarget;
}
function handleChatStream(data) {
  if (data.start) {
    ensureStreamTarget();
  } else if (data.delta) {
    const t = ensureStreamTarget();
    t.text += data.delta;
    t.el.innerHTML = escHtml(t.text) + '<span class="cursor"></span>';
    chatMessages.scrollTop = chatMessages.scrollHeight;
  } else if (data.end && streamTarget && streamTarget.el) {
    streamTarget.el.innerHTML = escHtml(streamTarget.text);
    streamTarget = null;
  }
}

function updateNodeStatus(nodeId, status, result) {
  const node = state.nodes.find(n => String(n.id) === String(nodeId) || n.name === nodeId);
  if (!node) return;
  node.status = status;
  renderNodes();
  // Update exec overlay step
  const step = document.getElementById('exec-step-' + nodeId);
  if (step) {
    const icon = step.querySelector('.exec-step__icon');
    icon.className = 'exec-step__icon exec-step__icon--' + status;
    icon.textContent = status === 'done' ? '✓' : status === 'failed' ? '✗' : status === 'interrupted' ? 'Ⅱ' : status === 'running' ? '...' : '○';
    if (result) {
      const time = step.querySelector('.exec-step__time');
      if (time && result.duration) time.textContent = formatDuration(result.duration);
    }
  }
  // Mark edges flowing
  if (status === 'running') {
    state.edges.forEach(e => {
      if (e.to === nodeId) { e.flowing = true; }
    });
    renderEdges();
  } else if (status === 'done' || status === 'failed' || status === 'interrupted') {
    state.edges.forEach(e => {
      if (e.to === nodeId) { e.flowing = false; }
    });
    renderEdges();
  }
}

function animateDataFlow(fromId, toId) {
  state.edges.forEach(e => {
    if ((e.from === fromId || e.from === fromId) && (e.to === toId || e.to === toId)) {
      e.flowing = true;
      setTimeout(() => { e.flowing = false; renderEdges(); }, 2000);
    }
  });
  renderEdges();
}

function handlePipelineDone(data) {
  state.runId = null;
  state.runStatus = null;
  state.nodes.forEach(n => {
    n.status = 'idle';
    // 不删除 runtime — retained runtime 仍然可用
  });
  // idle 是已完成且可复用的 runtime，不应再显示为“仍处于活动状态”。
  const activeRuntimeStatuses = new Set(['starting', 'ready', 'busy']);
  const activeRuntimes = state.nodes.filter(n => n.runtime && n.runtime.port && activeRuntimeStatuses.has(n.runtime.status)).length;
  if (activeRuntimes > 0) {
    addChatMessage('ai', '🎉 流水线执行完成！\n\n' + activeRuntimes + ' 个 serve runtime 仍处于活动状态，可在节点详情中查看端口并进入交互。', '流水线');
  } else {
    addChatMessage('ai', '🎉 流水线执行完成！', '流水线');
  }

  renderNodes();
  loadStats();
  loadRuns();
}

async function showNodeDetail(node) {

  $('#node-detail-title').textContent = node.name + ' (' + (typeLabels[node.type] || node.type) + ')';

  // Try to fetch full run data from API for stderr
  let output = state.nodeOutputs[String(node.id)] || state.nodeOutputs[node.name] || {};

    try {
      const runData = await apiGet('/runs/' + state.runId);
      if (runData && runData.nodeStates && runData.nodeStates[node.id]) {
        const ns = runData.nodeStates[node.id];
        const hasOutput = !!String(ns.output || output.output || '').trim();
        const hasError = !!String(ns.error || output.error || '').trim();
        let status = ns.status;
        if (status === 'complete' && !hasOutput && !hasError) status = 'empty';
        output = {
          output: ns.output || output.output || '',
          error: ns.error || output.error || '',
          stderr: ns.stderr || '',
          status: status === 'complete' ? 'done' : status === 'failed' ? 'failed' : status === 'interrupted' ? 'interrupted' : status === 'empty' ? 'empty' : 'running',

      </div>
    </div>
  `;
  // Runtime status section
  if (node.runtime) {
    const rt = node.runtime;
    const rtStatus = rt.status === 'ready' ? '🟢 运行中' :
                     rt.status === 'idle' ? '🟡 空闲（可进入）' :
                     rt.status === 'busy' ? '🔵 忙碌中' :
                     rt.status === 'stopped' ? '⚫ 已停止' :

    const canOpen = (rt.status === 'ready' || rt.status === 'idle' || rt.status === 'busy') && rt.endpoint;

          ${rt.accessMode === 'runtime_console' ? `<button onclick="interruptRuntime('${escHtml(rt.runtimeID || '')}')" style="font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:none;color:var(--warning);cursor:pointer">Interrupt（保留 runtime）</button>` : `<button disabled title="后续版本支持" style="font-size:11px;padding:4px 8px;border:1px solid var(--border);border-radius:4px;background:none;color:var(--muted-2);cursor:not-allowed">Interrupt（保留 runtime）</button>`}
        </div>
      </div>
    `;
  } else if (node.status === 'done' || node.status === 'failed') {
    html += `
      <div style="margin-bottom:12px;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)">

        <div style="font-size:11px;color:var(--muted-2)">无运行时实例（一次性执行，已结束）</div>
      </div>

  if (output.output) {
    html += `
      <div style="margin-bottom:12px">
        <div style="font-size:12px;color:var(--muted-2);margin-bottom:4px;font-weight:600">输出内容</div>
        <pre style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;font-size:12px;font-family:var(--mono);white-space:pre-wrap;max-height:400px;overflow-y:auto">${escHtml(output.output)}</pre>
      </div>

  }
  if (output.error) {
    html += `
      <div style="margin-bottom:12px">
        <div style="font-size:12px;color:var(--red);margin-bottom:4px;font-weight:600">错误信息</div>
        <pre style="background:var(--card);border:1px solid var(--red);border-radius:var(--radius);padding:10px;font-size:12px;font-family:var(--mono);white-space:pre-wrap;color:var(--red)">${escHtml(output.error)}</pre>
      </div>

  }
  if (output.stderr) {
    html += `
      <div style="margin-bottom:12px">
        <div style="font-size:12px;color:var(--muted-2);margin-bottom:4px;font-weight:600">思考/工具日志</div>
        <pre style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;font-size:11px;font-family:var(--mono);white-space:pre-wrap;max-height:300px;overflow-y:auto;color:var(--muted-2)">${escHtml(output.stderr)}</pre>
      </div>

    html += `

        <div style="font-size:14px;margin-bottom:8px">⚠️ 执行完成但没有返回正文</div>

      </div>

    html += `
      <div style="color:var(--muted-2);text-align:center;padding:20px;border:1px dashed var(--border);border-radius:var(--radius)">

      </div>
    `;
  }
  $('#node-detail-body').innerHTML = html;
  $('#node-detail-modal').style.display = 'flex';
}

// 回填 runtime 到各节点：遍历 state.runtimeStates，按 nodeID 找到对应 node 设置 node.runtime
function backfillRuntimeToNodes() {
  // 先清理所有 node.runtime
  state.nodes.forEach(n => { delete n.runtime; });
  // 优先级：busy > ready > idle > starting > stopped > error
  const priority = { busy: 5, ready: 4, idle: 3, starting: 2, stopped: 1, error: 0 };
  // 遍历 runtimeStates，按 nodeID 回填
  Object.values(state.runtimeStates).forEach(rt => {
    if (!rt || !rt.nodeID) return;
    const node = state.nodes.find(n => String(n.id) === String(rt.nodeID));
    if (!node) return;
    // 如果已经有 runtime，保留优先级更高的那个
    const existing = node.runtime;
    if (existing && existing.status && (priority[existing.status] || 0) > (priority[rt.status] || 0)) {
      return;
    }
    node.runtime = rt;
  });
}

// Stop a runtime by ID
async function stopRuntime(runtimeID) {
  if (!runtimeID) return;
  try {
    await apiPost('/runtimes/' + runtimeID + '/stop', {});
    // Find the node and clear its runtime
    const node = state.nodes.find(n => n.runtime && n.runtime.runtimeID === runtimeID);
    if (node) {
      delete node.runtime;
      renderNodes();
    }
    toast('Runtime 已停止', 'success');
  } catch (err) {
    toast('停止失败: ' + err.message, 'error');
  }
}

// One independent Runtime Console window per runtime. Multiple windows can be
// open at the same time (for example a Mimo window and a Codex window), each
// with its own polling timer, input and interrupt control.
const runtimeConsoles = new Map(); // runtimeID -> { modal, timer }
let consoleZ = 1000;

function consoleModal(runtimeID) {
  return (runtimeConsoles.get(runtimeID) || {}).modal || null;
}

function closeRuntimeConsole(runtimeID) {
  const entry = runtimeConsoles.get(runtimeID);
  if (!entry) return;
  if (entry.timer) { clearInterval(entry.timer); }
  entry.modal.remove();
  runtimeConsoles.delete(runtimeID);
}

async function openRuntimeConsole(runtimeID) {
  if (!runtimeID) return;
  const existing = runtimeConsoles.get(runtimeID);
  if (existing) {
    existing.modal.style.display = 'flex';
    existing.modal.style.zIndex = ++consoleZ;
    await refreshRuntimeConsole(runtimeID);
    return;
  }
  const tpl = document.getElementById('runtime-console-template');
  const node = tpl.content.cloneNode(true);
  const modal = node.querySelector('.rc-modal');
  modal.id = 'rc-modal-' + String(runtimeID).replace(/[^a-zA-Z0-9_-]/g, '_');
  // Stack offset so several consoles do not fully cover each other.
  const offset = (runtimeConsoles.size % 6) * 26;
  modal.style.left = offset + 'px';
  modal.style.top = offset + 'px';
  modal.style.zIndex = ++consoleZ;
  document.body.appendChild(node);
  const entry = { modal, timer: null, runtimeID };
  runtimeConsoles.set(runtimeID, entry);
  modal.querySelector('.rc-close').addEventListener('click', () => closeRuntimeConsole(runtimeID));
  modal.querySelector('.rc-send').addEventListener('click', () => sendRuntimeConsoleMessage(runtimeID));
  modal.querySelector('.rc-interrupt').addEventListener('click', () => interruptRuntime(runtimeID));
  // Clicking anywhere on the overlay brings the window to the front.
  modal.addEventListener('mousedown', () => { modal.style.zIndex = ++consoleZ; });
  modal.style.display = 'flex';
  await refreshRuntimeConsole(runtimeID);
  entry.timer = setInterval(() => refreshRuntimeConsole(runtimeID), 1200);
}

async function refreshRuntimeConsole(runtimeID) {
  if (!runtimeID) return;
  const modal = consoleModal(runtimeID);
  if (!modal) return;
  try {
    const data = await apiGet('/runtimes/' + encodeURIComponent(runtimeID) + '/console');
    renderRuntimeConsole(runtimeID, data || {});
  } catch (err) {
    modal.querySelector('.rc-events').textContent = '读取 Runtime Console 失败：' + (err.message || err);
  }
}

function renderRuntimeConsole(runtimeID, data) {
  const modal = consoleModal(runtimeID);
  if (!modal) return;
  const rt = data.runtime || {};
  modal.querySelector('.rc-title').textContent = 'Runtime Console · ' + (rt.model || rt.executor || 'Runtime');
  modal.querySelector('.rc-meta').innerHTML =
    '<div><span style="color:var(--muted-2)">状态</span>  ' + escHtml(rt.status || '-') + '</div>' +
    '<div><span style="color:var(--muted-2)">Runtime</span>  ' + escHtml(rt.runtimeID || '-') + '</div>' +
    '<div><span style="color:var(--muted-2)">Session/Thread</span>  ' + escHtml(data.threadID || rt.threadID || '尚未创建') + '</div>' +
    '<div><span style="color:var(--muted-2)">Turn</span>  ' + escHtml(data.turnID || rt.turnID || '空闲') + '</div>' +
    '<div><span style="color:var(--muted-2)">端点</span>  ' + escHtml(rt.endpoint || '-') + '</div>';
  const send = modal.querySelector('.rc-send');
  const interrupt = modal.querySelector('.rc-interrupt');
  send.disabled = !data.canSend;
  interrupt.disabled = !data.canInterrupt;
  modal.querySelector('.rc-output').textContent = data.output || data.error || '等待该 Runtime 的输出…';
  const events = Array.isArray(data.events) ? data.events : [];
  const container = modal.querySelector('.rc-events');
  const wasNearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 50;
  container.innerHTML = events.map(e => {
    const stamp = e.at ? new Date(e.at).toLocaleTimeString() : '--:--:--';
    const detail = e.text || e.payload || '';
    // Streaming deltas are already merged into one block per message by the
    // backend; reasoning stays dim and collapsed-looking so the assistant
    // answer is the visual focus.
    const reasoning = e.category === 'reasoning';
    const assistant = e.category === 'assistant';
    const color = e.level === 'error' ? '#ff7b72' : assistant ? '#a5d6ff' : reasoning ? '#6e7681' : '#b7c6db';
    const prefix = reasoning ? '🧠 推理 · ' : assistant ? '💬 回答 · ' : '';
    const label = (reasoning || assistant) ? prefix + (e.method || 'text') : (e.method || 'event');
    return '<div style="padding:5px 4px;border-bottom:1px solid rgba(255,255,255,.07)">' +
      '<span style="color:#7d8590">' + escHtml(stamp) + '</span> ' +
      '<span style="color:' + color + (reasoning ? ';font-style:italic' : '') + '">' + escHtml(label) + '</span>' +
      (detail ? '<pre style="margin:4px 0 0;white-space:pre-wrap;color:' + (reasoning ? '#8b949e' : '#c9d1d9') + ';font:inherit">' + escHtml(detail) + '</pre>' : '') +
      '</div>';
  }).join('') || '<div style="color:#7d8590;padding:8px">等待 Runtime 事件…</div>';
  if (wasNearBottom) container.scrollTop = container.scrollHeight;
}

async function sendRuntimeConsoleMessage(runtimeID) {
  const modal = consoleModal(runtimeID);
  if (!modal) return;
  const input = modal.querySelector('.rc-input');
  const text = String(input.value || '').trim();
  if (!text) return;
  try {
    modal.querySelector('.rc-send').disabled = true;
    await apiPost('/runtimes/' + encodeURIComponent(runtimeID) + '/message', { text });
    input.value = '';
    toast('已发送到同一保留会话', 'success');
    await refreshRuntimeConsole(runtimeID);
  } catch (err) { toast('发送失败: ' + err.message, 'error'); }
}

async function interruptRuntime(runtimeID) {
  if (!runtimeID) return;
  try {
    await apiPost('/runtimes/' + encodeURIComponent(runtimeID) + '/interrupt', {});
    toast('已请求中断当前 Turn；Runtime 与会话会保留', 'success');
    await refreshRuntimeConsole(runtimeID);
  } catch (err) { toast('中断失败: ' + err.message, 'error'); }
}

function buildPipelinePayload() {
  const payload = {
    name: state.pipelineName,
    nodes: state.nodes.map(n => ({
      id: String(n.id),
      name: n.name,
      type: n.type,
      model: n.model,
      agent: n.agent,
      skill: canonicalSkillForNode(n.skill || '', n.type, state.rewrittenTask || '', n.role || ''),
      skillPolicy: n.skillPolicy || '',
      reasoningEffort: n.reasoningEffort || '',
      mode: n.mode || 'serve',
      executor: n.executor || 'reasonix',
      role: n.role,
      x: n.x,
      y: n.y,
    })),
    edges: state.edges.map((e, index) => ({
      id: edgeId(e, index),
      from: String(e.from),
      to: String(e.to),
    })),
    loopConfig: getLoopConfig(),
  };
  console.log('[orch:pipeline] payload:', JSON.stringify(payload, null, 2));
  return payload;
}

// ── Loop config UI ──
function normalizeLoopConfigForSave(loopConfig) {
  if (!loopConfig || !loopConfig.enabled) return { enabled: false };
  const mode = loopConfig.mode === 'fixed' ? 'fixed' : 'review_decides';
  const rawIterations = mode === 'fixed'
    ? (loopConfig.fixedIterations ?? loopConfig.maxIterations)
    : loopConfig.maxIterations;
  const iterations = Math.min(10, Math.max(1, Number(rawIterations) || 3));
  const normalized = {
    enabled: true,
    mode,
    reviewNodeID: loopConfig.reviewNodeID == null ? '' : String(loopConfig.reviewNodeID),
    protocol: 'loop-review-v1',
  };
  if (mode === 'fixed') normalized.fixedIterations = iterations;
  else normalized.maxIterations = iterations;
  return normalized;
}

function markLoopConfigDirty() {
  if (state.pipelineHydrated) state.loopConfigDirty = true;
}

function syncLoopConfigUI() {
  const enabled = $('#cfg-loop-enabled')?.value === 'true';
  $('#loop-mode-field').style.display = enabled ? '' : 'none';
  $('#loop-iterations-field').style.display = enabled ? '' : 'none';
  $('#loop-reviewer-field').style.display = enabled ? '' : 'none';
  const reviewerSel = $('#cfg-loop-reviewer');
  const prevReviewer = reviewerSel.value;
  reviewerSel.innerHTML = '<option value="">选择审查节点...</option>';
  state.nodes.filter(n => n.type === 'reviewer').forEach(n => {
    const opt = document.createElement('option');
    opt.value = n.id;
    opt.textContent = n.name || n.id;
    reviewerSel.appendChild(opt);
  });
  if (prevReviewer && state.nodes.some(n => String(n.id) === String(prevReviewer))) {
    reviewerSel.value = String(prevReviewer);
  }
  if (typeof renderLoopOverlay === 'function') renderLoopOverlay();
}

function getLoopConfig() {
  // Before hydration the persisted value is safer than whatever the controls
  // currently happen to contain (usually the HTML default or the previous
  // session). After hydration, a dirty control is an intentional edit; an
  // untouched control continues to use the revision value.
  if (!state.pipelineHydrated) return normalizeLoopConfigForSave(state.loadedLoopConfig);
  if (state.pipelineRevisionID && !state.loopConfigDirty) {
    return normalizeLoopConfigForSave(state.loadedLoopConfig);
  }
  const enabled = $('#cfg-loop-enabled')?.value === 'true';
  if (!enabled) return { enabled: false };
  const mode = $('#cfg-loop-mode')?.value === 'fixed' ? 'fixed' : 'review_decides';
  const iterations = parseInt($('#cfg-loop-max')?.value, 10) || 3;
  return normalizeLoopConfigForSave({
    enabled: true,
    mode,
    reviewNodeID: $('#cfg-loop-reviewer')?.value || '',
    protocol: 'loop-review-v1',
    ...(mode === 'fixed' ? { fixedIterations: iterations } : { maxIterations: iterations }),
  });
}

function restoreLoopConfigUI(loopConfig, options = {}) {
  const normalized = normalizeLoopConfigForSave(loopConfig);
  $('#cfg-loop-enabled').value = normalized.enabled ? 'true' : 'false';
  $('#cfg-loop-mode').value = normalized.mode || 'review_decides';
  $('#cfg-loop-max').value = normalized.mode === 'fixed'
    ? (normalized.fixedIterations || 3)
    : (normalized.maxIterations || 3);
  syncLoopConfigUI();
  if (normalized.reviewNodeID) {
    $('#cfg-loop-reviewer').value = String(normalized.reviewNodeID);
  }
  if (options.markDirty === false) {
    state.loadedLoopConfig = normalized;
    state.loopConfigDirty = false;
  } else {
    markLoopConfigDirty();
  }
}
