        <div style="font-size:12px">这通常表示执行器没有真正产出内容，或输出被吞掉了。请优先查看下方日志。</div>
      </div>
    `;
  } else if (!output.output && !output.error) {
    html += `
      <div style="color:var(--muted-2);text-align:center;padding:20px;border:1px dashed var(--border);border-radius:var(--radius)">
        <div style="font-size:14px;margin-bottom:8px">⏳ 尚未执行</div>
        <div style="font-size:12px">执行流水线后，此节点的输出将显示在这里</div>
      </div>
    `;
  }
  $('#node-detail-body').innerHTML = html;
  $('#node-detail-modal').style.display = 'flex';
}

// 回填 runtime 到各节点：遍历 state.runtimeStates，按 nodeID 找到对应 node 设置 node.runtime
function backfillRuntimeToNodes() {
  // 先清理所有 node.runtime
  state.nodes.forEach(n => { delete n.runtime; });
  // 优先级：busy > ready > idle > starting > stopped > error
  const priority = { busy: 5, ready: 4, idle: 3, starting: 2, stopped: 1, error: 0 };
  // 遍历 runtimeStates，按 nodeID 回填
  Object.values(state.runtimeStates).forEach(rt => {
    if (!rt || !rt.nodeID) return;
    const node = state.nodes.find(n => String(n.id) === String(rt.nodeID));
    if (!node) return;
    // 如果已经有 runtime，保留优先级更高的那个
    const existing = node.runtime;
    if (existing && existing.status && (priority[existing.status] || 0) > (priority[rt.status] || 0)) {
      return;
    }
    node.runtime = rt;
  });
}

// Stop a runtime by ID
// Open a runtime's HTTP endpoint in the OS default browser (independent
// window). The server performs the launch so platform handling stays in Go.
async function openRuntimeBrowser(endpoint) {
  if (!endpoint) return;
  try {
    await api('POST', '/runtime/open', { endpoint });
    toast('已打开浏览器窗口', 'success');
  } catch (err) {
    // Fall back to a same-origin popup if the server cannot launch a browser.
    try { window.open(endpoint, '_blank'); } catch (_) {}
    toast('打开失败: ' + err.message, 'error');
  }
}

async function stopRuntime(runtimeID) {
  if (!runtimeID) return;
  try {
    await apiPost('/runtimes/' + runtimeID + '/stop', {});
    // Find the node and clear its runtime
    const node = state.nodes.find(n => n.runtime && n.runtime.runtimeID === runtimeID);
    if (node) {
      delete node.runtime;
      renderNodes();
    }
    toast('Runtime 已停止', 'success');
  } catch (err) {
    toast('停止失败: ' + err.message, 'error');
  }
}

// One independent Runtime Console window per runtime. Multiple windows can be
// open at the same time (for example a Mimo window and a Codex window), each
// with its own polling timer, input and interrupt control.
const runtimeConsoles = new Map(); // runtimeID -> { modal, timer }
let consoleZ = 1000;

function consoleModal(runtimeID) {
  return (runtimeConsoles.get(runtimeID) || {}).modal || null;
}

function closeRuntimeConsole(runtimeID) {
  const entry = runtimeConsoles.get(runtimeID);
  if (!entry) return;
  if (entry.timer) { clearInterval(entry.timer); }
  entry.modal.remove();
  runtimeConsoles.delete(runtimeID);
}

async function openRuntimeConsole(runtimeID) {
  if (!runtimeID) return;
  const existing = runtimeConsoles.get(runtimeID);
  if (existing) {
    existing.modal.style.display = 'flex';
    existing.modal.style.zIndex = ++consoleZ;
    await refreshRuntimeConsole(runtimeID);
    return;
  }
  const tpl = document.getElementById('runtime-console-template');
  const node = tpl.content.cloneNode(true);
  const modal = node.querySelector('.rc-modal');
  modal.id = 'rc-modal-' + String(runtimeID).replace(/[^a-zA-Z0-9_-]/g, '_');
  // Stack offset so several consoles do not fully cover each other.
  const offset = (runtimeConsoles.size % 6) * 26;
  modal.style.left = offset + 'px';
  modal.style.top = offset + 'px';
  modal.style.zIndex = ++consoleZ;
  document.body.appendChild(node);
  makeModalDraggable(modal.querySelector('.modal'));
  const entry = { modal, timer: null, runtimeID };
  runtimeConsoles.set(runtimeID, entry);
  modal.querySelector('.rc-close').addEventListener('click', () => closeRuntimeConsole(runtimeID));
  modal.querySelector('.rc-send').addEventListener('click', () => sendRuntimeConsoleMessage(runtimeID));
  modal.querySelector('.rc-interrupt').addEventListener('click', () => interruptRuntime(runtimeID));
  modal.querySelector('.rc-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      sendRuntimeConsoleMessage(runtimeID);
    }
  });
  // Clicking anywhere on the overlay brings the window to the front.
  modal.addEventListener('mousedown', () => { modal.style.zIndex = ++consoleZ; });
  modal.style.display = 'flex';
  await refreshRuntimeConsole(runtimeID);
  entry.timer = setInterval(() => refreshRuntimeConsole(runtimeID), 1200);
}

async function refreshRuntimeConsole(runtimeID) {
  if (!runtimeID) return;
  const modal = consoleModal(runtimeID);
  if (!modal) return;
  try {
    const data = await apiGet('/runtimes/' + encodeURIComponent(runtimeID) + '/console');
    renderRuntimeConsole(runtimeID, data || {});
  } catch (err) {
    // Do not wipe an already-rendered log on a transient API error; only show
    // the failure when there is nothing to preserve.
    const container = modal.querySelector('.rc-events');
    if (container && !container.children.length) {
      container.textContent = '读取 Runtime Console 失败：' + (err.message || err);
    }
  }
}

function renderRuntimeConsole(runtimeID, data) {
  const modal = consoleModal(runtimeID);
  if (!modal) return;
  const rt = data.runtime || {};
  modal.querySelector('.rc-title').textContent = 'Runtime Console · ' + (rt.model || rt.executor || 'Runtime');
  modal.querySelector('.rc-meta').innerHTML =
    '<div><span style="color:var(--muted-2)">状态</span>  ' + escHtml(rt.status || '-') + '</div>' +
    '<div><span style="color:var(--muted-2)">Runtime</span>  ' + escHtml(rt.runtimeID || '-') + '</div>' +
    '<div><span style="color:var(--muted-2)">Session/Thread</span>  ' + escHtml(data.threadID || rt.threadID || '尚未创建') + '</div>' +
    '<div><span style="color:var(--muted-2)">Turn</span>  ' + escHtml(data.turnID || rt.turnID || '空闲') + '</div>' +
    '<div><span style="color:var(--muted-2)">端点</span>  ' + escHtml(rt.endpoint || '-') + '</div>';
  const send = modal.querySelector('.rc-send');
  const interrupt = modal.querySelector('.rc-interrupt');
  send.disabled = !data.canSend;
  send.title = data.canSend
    ? '发送新 Turn（Enter 发送，Shift+Enter 换行）'
    : (rt.status === 'busy' ? 'Runtime 正在执行，完成后可发送' : 'Runtime 不可用（空闲后可发送）');
  interrupt.disabled = !data.canInterrupt;
  interrupt.title = data.canInterrupt ? '中断当前 Turn（保留 Runtime 与会话）' : '当前无活动 Turn 可中断';
  modal.querySelector('.rc-output').textContent = data.output || data.error || '等待该 Runtime 的输出…';
  // Parked tool-approval prompts ("ask" approval mode): one card per request
  // with allow-once / allow-always / reject actions.
  const perms = (rt.permissionRequests || []).filter(Boolean);
  const permBox = modal.querySelector('.rc-permissions');
  if (!permBox) return;
  if (!perms.length) {
    permBox.innerHTML = '';
  } else {
    permBox.innerHTML = '<div style="font-size:11px;font-weight:600;color:var(--warning);margin-bottom:2px">待批准的工具请求（ask 模式）</div>' + perms.map(p =>
      '<div style="border:1px solid var(--warning);border-radius:var(--radius);background:var(--card);padding:8px 10px">' +
        '<div style="font-size:12px;font-weight:600;color:var(--fg)">⏸ ' + escHtml(p.toolName || 'unknown-tool') + '</div>' +
        (p.toolInput ? '<div style="font-size:11px;color:var(--muted);margin:4px 0;white-space:pre-wrap;word-break:break-all;max-height:64px;overflow:auto">' + escHtml(p.toolInput) + '</div>' : '') +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">' +
          '<button class="run-dash__btn" data-act="allow_once" data-rid="' + escHtml(p.requestId) + '" style="border-color:var(--success);color:var(--success)">允许一次</button>' +
          '<button class="run-dash__btn" data-act="allow_always" data-rid="' + escHtml(p.requestId) + '" style="border-color:var(--accent);color:var(--accent)">始终允许</button>' +
          '<button class="run-dash__btn" data-act="reject" data-rid="' + escHtml(p.requestId) + '" style="border-color:var(--danger);color:var(--danger)">拒绝</button>' +
        '</div>' +
      '</div>'
    ).join('');
    permBox.querySelectorAll('button[data-act]').forEach(btn => {
      btn.addEventListener('click', () => answerRuntimePermission(runtimeID, btn.dataset.rid, btn.dataset.act));
    });
  }
  const events = Array.isArray(data.events) ? data.events : [];
  const container = modal.querySelector('.rc-events');
  renderRuntimeEvents(container, events, modal);
}

function runtimeEventKey(e) {
  return String(e.at || '') + '|' + String(e.method || '') + '|' + String(e.category || '');
}

function runtimeEventHtml(e) {
  const stamp = e.at ? new Date(e.at).toLocaleTimeString() : '--:--:--';
  const detail = e.text || e.payload || '';
  // Streaming deltas are already merged into one block per message by the
  // backend. Reasoning is folded by default so the assistant answer is the
  // visual focus; expanded state survives polling refreshes (see
  // renderRuntimeEvents).
  const reasoning = e.category === 'reasoning';
  const assistant = e.category === 'assistant';
  const color = e.level === 'error' ? '#d1242f' : assistant ? '#0969da' : '#57606a';
  const prefix = reasoning ? '🧠 推理 · ' : assistant ? '💬 回答 · ' : '';
  const label = (reasoning || assistant) ? prefix + (e.method || 'text') : (e.method || 'event');
  if (reasoning) {
    return '<details class="rc-ev">' +
      '<summary><span style="color:#8c959f">' + escHtml(stamp) + '</span> ' +
      '<span style="color:#57606a;font-style:italic">' + escHtml(label) + '</span>' +
      '<span style="margin-left:auto;color:#8c959f">' + (detail ? '展开推理' : '') + '</span></summary>' +
      (detail ? '<div class="chat-bubble__inner rc-md">' + renderMarkdown(detail) + '</div>' : '<pre style="color:#57606a">（无推理内容）</pre>') +
      '</details>';
  }
  if (assistant) {
    // QA content stays expanded, rendered as Obsidian-style markdown like
    // the main chat (headings, tables, code blocks, bold…).
    return '<div style="padding:5px 4px;border-bottom:1px solid rgba(15,23,42,.07)">' +
      '<span style="color:#8c959f">' + escHtml(stamp) + '</span> ' +
      '<span style="color:' + color + '">' + escHtml(label) + '</span>' +
      (detail ? '<div class="chat-bubble__inner rc-md">' + renderMarkdown(detail) + '</div>' : '') +
      '</div>';
  }
  // Non-QA (system/tool/usage) events are folded; click to expand the raw log.
  return '<details class="rc-ev">' +
    '<summary><span style="color:#8c959f">' + escHtml(stamp) + '</span> ' +
    '<span style="color:' + color + '">' + escHtml(label) + '</span>' +
    (e.level === 'error' ? ' <span style="color:#d1242f">⚠</span>' : '') +
    '<span style="margin-left:auto;color:#8c959f">' + (detail ? '展开日志' : '') + '</span></summary>' +
    (detail ? '<pre>' + escHtml(detail) + '</pre>' : '<pre style="color:#57606a">（无内容）</pre>') +
    '</details>';
}

// Incremental renderer for the Runtime Console event list. Existing DOM nodes
// are kept (so expanded <details> survive refreshes); only new events are
// appended, and the scroll position is only advanced when the user is already
// at the bottom.
function renderRuntimeEvents(container, events, modal) {
  const prev = modal._rcEvents || [];
  const nearBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 50;

  // Detect non-append changes (fewer events, or a rewritten prefix) that
  // require a full rebuild; preserve expanded state and scroll position.
  let prefixDiffers = events.length < prev.length;
  if (!prefixDiffers) {
    for (let i = 0; i < prev.length; i++) {
      if (runtimeEventKey(prev[i]) !== runtimeEventKey(events[i])) {
        prefixDiffers = true;
        break;
      }
    }
  }

  if (prefixDiffers || events.length === 0) {
    const openStates = Array.from(container.querySelectorAll('details.rc-ev')).map(d => d.open);
    const scrollTop = container.scrollTop;
    container.innerHTML = events.map(runtimeEventHtml).join('') ||
      '<div style="color:#8c959f;padding:8px">等待 Runtime 事件…</div>';
    const details = container.querySelectorAll('details.rc-ev');
    openStates.forEach((open, i) => { if (details[i]) details[i].open = open; });
    container.scrollTop = Math.min(scrollTop, container.scrollHeight);
  } else {
    if (prev.length === 0) container.innerHTML = '';
    // Update the last event(s) in place when the backend accumulates streaming
    // deltas into the same logical event.
    for (let i = 0; i < prev.length; i++) {
      const oldText = String(prev[i].text || prev[i].payload || '');
      const newText = String(events[i].text || events[i].payload || '');
      if (oldText !== newText) {
        const node = container.children[i];
        if (node) {
          const wasOpen = node.tagName === 'DETAILS' ? node.open : false;
          const wrap = document.createElement('div');
          wrap.innerHTML = runtimeEventHtml(events[i]);
          const freshNode = wrap.firstElementChild;
          if (freshNode && freshNode.tagName === 'DETAILS' && wasOpen) freshNode.open = true;
          if (freshNode) node.replaceWith(freshNode);
        }
      }
    }
    // Append only the newly arrived events.
    for (let i = prev.length; i < events.length; i++) {
      const wrap = document.createElement('div');
      wrap.innerHTML = runtimeEventHtml(events[i]);
      const node = wrap.firstElementChild;
      if (node) container.appendChild(node);
    }
    if (nearBottom) container.scrollTop = container.scrollHeight;
  }
  modal._rcEvents = events;
}

async function sendRuntimeConsoleMessage(runtimeID) {
  const modal = consoleModal(runtimeID);
  if (!modal) return;
  const input = modal.querySelector('.rc-input');
  const btn = modal.querySelector('.rc-send');
  const text = String(input.value || '').trim();
  if (!text) return;
  // Two-step confirmation: first click arms the button, second click sends.
  if (modal.dataset.sendConfirm !== '1') {
    modal.dataset.sendConfirm = '1';
    btn.textContent = '⚠️ 再次点击确认发送';
    btn.classList.add('rc-send--confirm');
    clearTimeout(modal._sendConfirmTimer);
    modal._sendConfirmTimer = setTimeout(() => {
      modal.dataset.sendConfirm = '';
      btn.textContent = '发送新 Turn';
      btn.classList.remove('rc-send--confirm');
    }, 4000);
    return;
  }
  modal.dataset.sendConfirm = '';
  clearTimeout(modal._sendConfirmTimer);
  btn.classList.remove('rc-send--confirm');
  try {
    btn.disabled = true;
    btn.textContent = '发送中…';
    await apiPost('/runtimes/' + encodeURIComponent(runtimeID) + '/message', { text });
    input.value = '';
    btn.textContent = '发送新 Turn';
    toast('已发送到同一保留会话', 'success');
    await refreshRuntimeConsole(runtimeID);
  } catch (err) {
    btn.textContent = '发送新 Turn';
    toast('发送失败: ' + err.message, 'error');
  }
}

// answerRuntimePermission resolves a parked tool-approval prompt on a runtime
// console ("ask" approval mode): allow_once | allow_always | reject.
async function answerRuntimePermission(runtimeID, requestId, action) {
  if (!runtimeID || !requestId) return;
  try {
    await apiPost('/runtimes/' + encodeURIComponent(runtimeID) + '/permission', { requestId, action });
    toast(action === 'reject' ? '已拒绝该工具请求' : '已批准该工具请求', 'success');
    await refreshRuntimeConsole(runtimeID);
  } catch (err) {
    toast('批准失败: ' + err.message, 'error');
  }
}

async function interruptRuntime(runtimeID) {
  if (!runtimeID) return;
  try {
    await apiPost('/runtimes/' + encodeURIComponent(runtimeID) + '/interrupt', {});
    toast('已请求中断当前 Turn；Runtime 与会话会保留', 'success');
    await refreshRuntimeConsole(runtimeID);
  } catch (err) { toast('中断失败: ' + err.message, 'error'); }
}

function buildPipelinePayload() {
  const payload = {
    name: state.pipelineName,
    nodes: state.nodes.map(n => ({
      id: String(n.id),
      name: n.name,
      type: n.type,
      model: n.model,
      agent: n.agent,
      skill: canonicalSkillForNode(n.skill || '', n.type, state.rewrittenTask || '', n.role || ''),
      skillPolicy: n.skillPolicy || '',
      reasoningEffort: n.reasoningEffort || '',
      mode: n.mode || 'serve',
      executor: n.executor || 'reasonix',
      approvalMode: n.approvalMode || 'auto',
      role: n.role,
      x: n.x,
      y: n.y,
    })),
    edges: state.edges.map((e, index) => ({
      id: edgeId(e, index),
      from: String(e.from),
      to: String(e.to),
    })),
    loopConfig: getLoopConfig(),
  };
  console.log('[orch:pipeline] payload:', JSON.stringify(payload, null, 2));
  return payload;
}

// ── Loop config UI ──
function normalizeLoopConfigForSave(loopConfig) {
  if (!loopConfig || !loopConfig.enabled) return { enabled: false };
  const mode = loopConfig.mode === 'fixed' ? 'fixed' : 'review_decides';
  const rawIterations = mode === 'fixed'
    ? (loopConfig.fixedIterations ?? loopConfig.maxIterations)
    : loopConfig.maxIterations;
  const iterations = Math.min(10, Math.max(1, Number(rawIterations) || 3));
  const normalized = {
    enabled: true,
    mode,
    reviewNodeID: loopConfig.reviewNodeID == null ? '' : String(loopConfig.reviewNodeID),
    protocol: 'loop-review-v1',
  };
  if (mode === 'fixed') normalized.fixedIterations = iterations;
  else normalized.maxIterations = iterations;
  return normalized;
}

function markLoopConfigDirty() {
  if (state.pipelineHydrated) state.loopConfigDirty = true;
}

function syncLoopConfigUI() {
  const enabled = $('#cfg-loop-enabled')?.value === 'true';
  $('#loop-mode-field').style.display = enabled ? '' : 'none';
  $('#loop-iterations-field').style.display = enabled ? '' : 'none';
  $('#loop-reviewer-field').style.display = enabled ? '' : 'none';
  const reviewerSel = $('#cfg-loop-reviewer');
  const prevReviewer = reviewerSel.value;
  reviewerSel.innerHTML = '<option value="">选择审查节点...</option>';
  state.nodes.filter(n => n.type === 'reviewer').forEach(n => {
    const opt = document.createElement('option');
    opt.value = n.id;
    opt.textContent = n.name || n.id;
    reviewerSel.appendChild(opt);
  });
  if (prevReviewer && state.nodes.some(n => String(n.id) === String(prevReviewer))) {
    reviewerSel.value = String(prevReviewer);
  }
  if (typeof renderLoopOverlay === 'function') renderLoopOverlay();
}

function getLoopConfig() {
  // Before hydration the persisted value is safer than whatever the controls
  // currently happen to contain (usually the HTML default or the previous
  // session). After hydration, a dirty control is an intentional edit; an
  // untouched control continues to use the revision value.
  if (!state.pipelineHydrated) return normalizeLoopConfigForSave(state.loadedLoopConfig);
  if (state.pipelineRevisionID && !state.loopConfigDirty) {
    return normalizeLoopConfigForSave(state.loadedLoopConfig);
  }
  const enabled = $('#cfg-loop-enabled')?.value === 'true';
  if (!enabled) return { enabled: false };
  const mode = $('#cfg-loop-mode')?.value === 'fixed' ? 'fixed' : 'review_decides';
  const iterations = parseInt($('#cfg-loop-max')?.value, 10) || 3;
  return normalizeLoopConfigForSave({
    enabled: true,
    mode,
    reviewNodeID: $('#cfg-loop-reviewer')?.value || '',
    protocol: 'loop-review-v1',
    ...(mode === 'fixed' ? { fixedIterations: iterations } : { maxIterations: iterations }),
  });
}

function restoreLoopConfigUI(loopConfig, options = {}) {
  const normalized = normalizeLoopConfigForSave(loopConfig);
  $('#cfg-loop-enabled').value = normalized.enabled ? 'true' : 'false';
  $('#cfg-loop-mode').value = normalized.mode || 'review_decides';
  $('#cfg-loop-max').value = normalized.mode === 'fixed'
    ? (normalized.fixedIterations || 3)
    : (normalized.maxIterations || 3);
  syncLoopConfigUI();
  if (normalized.reviewNodeID) {
    $('#cfg-loop-reviewer').value = String(normalized.reviewNodeID);
  }
  if (options.markDirty === false) {
    state.loadedLoopConfig = normalized;
    state.loopConfigDirty = false;
  } else {
    markLoopConfigDirty();
  }
}

// ── Load models, skills ──
function autoSkillForStep(step, nodeType, taskText = '') {
  const catalog = Array.isArray(state.skillCatalog) ? state.skillCatalog : [];
  const names = new Set(catalog.map(x => String(x?.name || x).toLowerCase()));
  const text = String(taskText || '') + ' ' + String(step?.roleDesc || step?.role || '') + ' ' + String(step?.step || '');
  const lower = text.toLowerCase();
  let preferred = nodeType === 'reviewer'
    ? ['review-agent', 'code-review', 'code-reviewer']
    : nodeType === 'architect'
      ? ['brainstorming', 'design-blueprint', 'json-canvas', 'executing-plans']
      : ['executing-plans', 'frontend-design', 'playwright', 'pdf'];
  if (/论文|学术|文献|research/i.test(lower)) preferred = ['deep-research', 'nature-academic-search', ...preferred];
  const hit = preferred.find(name => names.has(name.toLowerCase()));
  return hit || '';
}

// Convert model-generated aliases/invalid names to a real catalog entry. The
// backend performs the same safety resolution at execution time, but doing it
// here makes the assignment visible on the Canvas and in the node inspector.
function canonicalSkillForNode(skill, nodeType, taskText = '', roleText = '') {
  const catalog = Array.isArray(state.skillCatalog) ? state.skillCatalog : [];
  const requested = String(skill || '').trim();
  if (!catalog.length) return requested;
  const exact = catalog.find(item => String(item?.name || item).toLowerCase() === requested.toLowerCase());
  if (exact) return String(exact.name || exact);
  return autoSkillForStep({ roleDesc: roleText, step: taskText }, nodeType, taskText);
}
async function loadNodeTypes() {
  try {
    const types = await apiGet('/nodes/types');
    state.nodeTypes = types || [];

      const catalog = await apiGet('/skills');
      state.skillCatalog = Array.isArray(catalog) ? catalog : [];
      state.skills = state.skillCatalog.map(x => x.name).filter(Boolean);
      // Repair defaults and older/generated nodes after the catalog is known.
      state.nodes.forEach(node => {
        node.skill = canonicalSkillForNode(node.skill, node.type, state.rewrittenTask || '', node.role || '');
      });
    } catch (_) {
      state.skillCatalog = [];
    }
    console.log('[orch:config] nodeTypes loaded:', types?.map(t => t.type).join(', '), 'skills:', state.skills.length);
    // Dynamically rebuild executor dropdown from backend capabilities
    const allExecutors = [...new Set(types?.flatMap(t => (t.executors || []).map(String)) || [])];
    console.log('[orch:config] executors:', allExecutors);
    const execSel = $('#cfg-executor');
    const prevVal = execSel.value;
    execSel.innerHTML = '';
    allExecutors.forEach(ex => {

function populateModelSelect(node) {

  sel.innerHTML = '<option value="">选择模型...</option>';

    opt.textContent = m;

  sel.value = activeNode?.model || '';

function populateSkillSelect(node) {
  const sel = $('#cfg-skill');
  sel.innerHTML = '<option value="">无</option>';
  const activeNode = node || (state.selectedNode ? state.nodes.find(n => n.id === state.selectedNode) : null);
  const activeType = activeNode?.type || 'executor';
  const typeInfo = state.nodeTypes.find(t => t.type === activeType);
  const skills = state.skillCatalog.length
    ? state.skillCatalog.map(x => x.name).filter(Boolean)
    : (typeInfo?.skills || state.nodeTypes.flatMap(t => t.skills || []));
  const unique = [...new Set(skills)];
  unique.forEach(s => {
    const opt = document.createElement('option');
    opt.value = s;
    opt.textContent = s;
    sel.appendChild(opt);
  });
  if (activeNode) {
    activeNode.skill = canonicalSkillForNode(activeNode.skill, activeNode.type, state.rewrittenTask || '', activeNode.role || '');
    sel.value = activeNode.skill || '';
  }
}

function tryParseReview(detail) {
  const s = String(detail || '');
  let j = null;
  try { j = JSON.parse(s); } catch (_) {}
  if (!j) { const m = s.match(/\{[\s\S]*\}/); if (m) { try { j = JSON.parse(m[0]); } catch (_) {} } }
  return (j && j.decision && (j.schemaVersion === 'loop-review-v1' || j.requiredChanges || j.summary)) ? j : null;
}

    list.innerHTML = '<div style="text-align:center;color:var(--muted-2);padding:20px;font-size:13px">暂无执行记录</div>';
    return;
  }
  const statusIcons = { running: '⏳', complete: '✅', failed: '❌', canceled: '🚫', blocked: '⛔', interrupted: '⏸️' };
  list.innerHTML = runs.map(r => {
    const icon = statusIcons[r.status] || '⏳';
    const taskPreview = (r.task || '').substring(0, 60);
    const nodeCount = r.nodeStates ? Object.keys(r.nodeStates).length : 0;
    const successCount = r.nodeStates ? Object.values(r.nodeStates).filter(ns => ns.status === 'complete').length : 0;
    const failCount = r.nodeStates ? Object.values(r.nodeStates).filter(ns => ns.status === 'failed').length : 0;
    const started = r.startedAt ? new Date(r.startedAt).toLocaleTimeString() : '';
    const finished = r.finishedAt ? new Date(r.finishedAt).toLocaleTimeString() : '';
    const trigger = r.trigger || 'manual';
    const cfg = r.loopConfig || {};
    const iterations = state.runIterations[r.id] || [];
    const mode = cfg.enabled ? (cfg.mode || 'review_decides') : '';
    const max = mode === 'fixed' ? (cfg.fixedIterations || cfg.maxIterations || 0) : (cfg.maxIterations || 0);
    const current = r.currentIteration || (iterations.length ? iterations[iterations.length - 1].number : 0);
    const finalDecision = r.finalReview?.decision || (iterations.length ? iterations[iterations.length - 1].decision : '');
    const resumeButton = r.status === 'interrupted' && cfg.enabled
      ? `<button class="run-resume-btn" data-resume-run="${escHtml(r.id)}" style="margin-top:7px;padding:4px 9px;border:1px solid var(--accent);border-radius:5px;background:transparent;color:var(--accent);cursor:pointer;font-size:11px">继续 Loop</button>` : '';
    const cancelButton = r.status === 'running'
      ? `<button class="run-cancel-btn" data-cancel-run="${escHtml(r.id)}" style="margin-top:7px;margin-left:6px;padding:4px 9px;border:1px solid var(--danger);border-radius:5px;background:transparent;color:var(--danger);cursor:pointer;font-size:11px">停止</button>` : '';
    return `
    <div class="run-card" style="cursor:pointer;padding:10px;background:var(--card);border:1px solid var(--border);border-radius:6px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:16px">${icon}</span>
        <span style="font-weight:600;font-size:12px;flex:1">${escHtml(r.id || '')}</span>
        <span style="font-size:11px;color:var(--muted-2)">${escHtml(r.status)}</span>
      </div>
      ${taskPreview ? `<div style="font-size:11px;color:var(--muted-2);margin-top:4px">${escHtml(taskPreview)}</div>` : ''}
      <div style="font-size:11px;color:var(--muted-2);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap">
        <span>节点: ${successCount}/${nodeCount}</span>
        ${failCount > 0 ? `<span style="color:var(--danger)">失败: ${failCount}</span>` : ''}
        <span>触发: ${escHtml(trigger)}</span>
        ${started ? `<span>${started}${finished ? ' → ' + finished : ''}</span>` : ''}
      </div>
      ${cfg.enabled ? `<div style="font-size:11px;color:var(--muted-2);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap">
        <span>Loop：第 ${current} / ${max} 轮</span><span>模式：${escHtml(mode)}</span>
        ${r.terminationReason ? `<span>终止原因：${escHtml(r.terminationReason)}</span>` : ''}
        ${finalDecision ? `<span>最终 Review：${escHtml(finalDecision)}</span>` : ''}
      </div>` : ''}
      ${r.error ? `<div style="font-size:11px;color:var(--danger);margin-top:4px">${escHtml(r.error.substring(0, 100))}</div>` : ''}
      ${resumeButton}${cancelButton}
    </div>`;
  }).join('');
  list.querySelectorAll('[data-resume-run]').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      resumeLoopRun(btn.getAttribute('data-resume-run'));
    });
  });
  list.querySelectorAll('[data-cancel-run]').forEach(btn => {
    btn.addEventListener('click', event => {
      event.stopPropagation();
      cancelOrchRun(btn.getAttribute('data-cancel-run'));
    });
  });
}

function showSessionDetail(session, runs) {
  const statusIcons = { running: '⏳', complete: '✅', failed: '❌', canceled: '🚫', blocked: '⛔', interrupted: '⏸️' };
  let html = `<div style="margin-bottom:12px"><b>需求：</b>${escHtml(session.task || '')}</div>`;
  if (runs.length) {
    html += '<div style="font-size:12px;color:var(--muted-2);margin-bottom:8px">执行记录：</div>';
    html += runs.map(r => {
      const tokens = (r.nodeStates ? Object.values(r.nodeStates).reduce((a, ns) => a + (ns.tokenUsage?.totalTokens || 0), 0) : 0);
      const cost = (r.nodeStates ? Object.values(r.nodeStates).reduce((a, ns) => a + (ns.tokenUsage?.costYuan || 0), 0) : 0);
      return `<div style="background:var(--card);border:1px solid var(--border);border-radius:6px;padding:8px;margin-bottom:6px;font-size:12px">
        <div>${statusIcons[r.status] || '⏳'} ${r.id} <span style="color:var(--muted-2)">${r.status}</span></div>
        <div style="color:var(--muted-2);margin-top:4px">Token: ${formatNumber(tokens)} · ¥${cost.toFixed(4)}</div>
      </div>`;
    }).join('');
  }
  // Show in node detail modal
  $('#node-detail-title').textContent = '会话详情';
  $('#node-detail-body').innerHTML = html;
  $('#node-detail-modal').style.display = 'flex';
}

// ── Utilities ──
function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function formatNumber(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}

function formatDuration(ms) {
  if (typeof ms === 'string') return ms;
  if (ms >= 60000) return (ms / 60000).toFixed(1) + 'm';
  if (ms >= 1000) return (ms / 1000).toFixed(1) + 's';
  return ms + 'ms';
}

// ── Load chat history on startup ──
async function loadChatHistory() {
  await refreshChatHistory();
}

// ── Init ──
async function init() {
  console.log('[init] starting...');
  connectSSE();
  console.log('[init] connectSSE called');
  try { await loadPresets(); } catch (e) { console.error('[init] loadPresets failed:', e); }
  try { await loadNodeTypes(); } catch (e) { console.error('[init] loadNodeTypes failed:', e); }
  // Try to load orchestration session from URL or localStorage
  const urlParams = new URLSearchParams(window.location.search);
  state.sessionID = urlParams.get('session') || localStorage.getItem('orchestrator-session-id') || null;
  try {
    // Resolve URL/localStorage through the session index first. A stale ID is
    // reported instead of silently switching to another historical session.
    await loadPreferredOrchestrationSession(state.sessionID || '');
  } catch (e) {
    console.warn('[init] no orchestration sessions found:', e);
  }
  try {
    // The orchestration transcript is authoritative for this UI. Only use the
    // native controller history when no orchestration conversation exists.
    const hasOrchestrationConversation = state.sessionID &&
      Array.isArray(state.chatMessages) && state.chatMessages.length > 0;
    if (!hasOrchestrationConversation) await loadChatHistory();
  } catch (e) { console.warn('[init] loadChatHistory:', e); }
  try { loadStats(); } catch (e) { console.error('[init] loadStats failed:', e); }
  try { loadAgents(); } catch (e) { console.error('[init] loadAgents failed:', e); }
  try { loadRuns(); } catch (e) { console.error('[init] loadRuns failed:', e); }
  try { await refreshHistory(); } catch (e) { console.warn('[init] refreshHistory:', e); }
  if (configPanel.classList.contains('config--hidden')) {
    $('#app').classList.add('app--no-config');
  }
  console.log('[init] done');
}

document.addEventListener('DOMContentLoaded', init);
</script>
