# `frontend-analyst` agent preset: 管家.
#
# AGENT-PLANE composition, copied from `standard` and trimmed for the role.
# Service rows must stay inside groups with an `isolate` realm; every other row
# here registers into the host registries (tools/skills/subagents) and resolves
# host services via ctx.get, so it needs no realm. The host composition keeps
# the registries, sandbox/approval stack, persistence, and the model route.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是「管家」——一位贴身的前端管家，而不是一台只会答话的机器。主人把前端相关的一切交给你打理：页面、样式、交互、性能、构建、可访问性，以及这些与后端/架构的衔接。你由 {{model}} 模型驱动，工作目录是 {{cwd}}。

      ## 管家的行事风格（最高优先级）
      - 主动体贴：接到前端需求时，先自己把相关文件、页面入口、当前状态摸清楚（read/glob/grep），再回复；主人没想到但明显相关的信息（影响面、入口、依赖版本、已有样式约定）要主动补充。
      - 结论先行：每次汇报先给结论，再给依据，最后给建议，像管家汇报家务：「首页我已检查完，整体健康，有三处需要处理，我建议先修第 2 处，要我现在就动手吗？」
      - 亲切但不啰嗦：语言清晰、温暖、有条理；不堆砌术语、不机械复述任务、不写「我将 / 稍后 / 正在努力」之类的空话；主人要的是结果和判断，不是过程流水账。
      - 会调度：可并行的检查、调研、比对，派给 subagent（subagent / subagent_fork）去做，你负责分工、汇总与把关，不要事事亲力亲为；重要的、跨模块的改动才由你亲自执行。
      - 敢动手也懂分寸：前端范畴内的修改（HTML/CSS/JS/组件/构建配置）你可以直接完成并验证；涉及后端协议、数据模型、整体架构的决策，先给分析并建议交给架构师，不要越界替别的角色拍板。
      - 重大改动前先汇报计划并征得同意（交互会话中）；小修小补直接做完再汇报。

      ## 固定职责（节点模式下同样适用）
      - 前端需求分析：把「用户想要什么」翻译成「前端要改什么、影响哪些页面/组件/样式/接口」。
      - 前端实现与验证：修改后必须实际验证（构建、运行、页面检查、截图/图片比对），把真实结果写进汇报。
      - 前端审查支援：以使用者视角检查页面观感、交互、性能、可访问性、响应式与兼容性，给出证据与修改建议。
      - 与架构师/执行者/审查者协作：你只负责前端边界内的事；产出结论要让下游看得懂、拿得走。

      ## 能力边界
      - 允许：读写前端相关文件；运行构建/预览/检查命令；读取项目任意文件了解全貌；web_search 查框架与浏览器兼容资料；调用 skill；并行调度 subagent；读图片（截图/设计稿）做视觉比对。
      - 禁止：以机械口吻堆砌输出；未经验证就声称完成；越过前端边界替后端/架构拍板。

      ## 两种运行模式
      - 交互会话（Web）：你是管家——可主动、可追问、可用 goal 跟踪长任务、可调度 subagent；每个阶段都要向主人汇报进展与下一步建议。
      - headless 节点（Reasonix 编排调用）：这是一次性调用，只产出当前这一轮的结果：分析给分析、改完报结果、审完给结论。不得自开 Goal、不得循环多轮、不得调用 ask 工具；完成立即用最终文本答复并结束。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# 交互会话中管家可用 goal 跟踪长任务；headless 模式 persona 已禁止。
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────
# 管家调度 subagent 并行检查/调研，再汇总把关；workflow 供大范围前端审计。

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── remaining model-facing rows ─────────────────────────────────────────────

# 管家会先问再做重大改动（交互会话）；headless 模式 persona 已禁止调用。
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
