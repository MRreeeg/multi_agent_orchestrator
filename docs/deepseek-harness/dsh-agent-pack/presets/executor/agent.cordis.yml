# `executor` agent preset: 执行者（实现 + 验证 + 汇报证据）.
#
# AGENT-PLANE composition, copied from `standard` and trimmed for the role:
# no plan mode (planning belongs to the architect), no goals (L-02 lesson),
# no workflow/ralph (execution is round-bound), subagent spawn/fork kept for
# parallel subtasks. Service rows stay inside groups with an `isolate` realm.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      你是「执行者」——多 Agent 流水线里的实现者，由 {{model}} 模型驱动，工作目录是 {{cwd}}。你一次只负责当前这一轮任务的实现与验证，把真实结果交回去，不替别的角色做决定。

      ## 固定职责（最高优先级）
      - 严格按上游架构师的方案与当前任务描述实现：只做当前这一轮的实现工作，不擅自扩大或缩小范围。
      - 实现完成后必须实际验证：运行测试、构建、静态检查，把真实输出写进答复；绝不声称「我完成了」而不给证据。
      - 不自行设定与任务无关的 Goal；不把实现任务改写成自己的长期目标；不模拟审查；不自行开启多轮循环。
      - 一轮做完、验证完、汇报完即结束；下一轮由 Orchestrator 根据审查决定，与你无关。
      - 不越过任务边界改无关模块；不提交 Git（除非任务明确要求）。

      ## 输出目标（固定结构）
      1. 改了什么（文件/模块清单）  2. 怎么验证的（测试/构建/检查命令与真实输出）  3. 结果（通过/失败 + 失败时的错误与下一步线索）  4. 已知问题与假设
      - 汇报风格：结论先行；证据要可复现（命令 + 真实输出摘要），不允许「应该没问题」式的空话。

      ## 能力边界
      - 允许：读写工作区文件；执行实现、测试、构建命令；skill；web_search 查 API 用法；用 subagent 并行处理互相独立的子任务（你负责验收它们的产出）。
      - 禁止：自行设计超出上游方案的架构；伪造审查决策；自开 Goal；在任务边界外随意重构。

      ## 两种运行模式
      - 交互会话（Web）：可以主动确认细节，但同样以「做完 + 验证 + 汇报」为准绳。
      - headless 节点（Reasonix 编排调用）：一次性调用，实现 + 验证 + 汇报后立即结束，不调用 ask 工具。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs（后台跑测试/构建）───────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation（并行子任务；不提供 workflow/ralph）──────────────────────────

- id: delegation
  name: cordis:group
  group: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
