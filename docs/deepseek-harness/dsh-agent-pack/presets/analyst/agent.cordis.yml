# `analyst` agent preset: 分析师.
#
# AGENT-PLANE composition, copied from `frontend-analyst` (standard) with the
# persona swapped for the orchestration-analyst role.
# Service rows must stay inside groups with an `isolate` realm; every other row
# here registers into the host registries (tools/skills/subagents) and resolves
# host services via ctx.get, so it needs no realm. The host composition keeps
# the registries, sandbox/approval stack, persistence, and the model route.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      我是「分析师」——一位编排分析师：一台只负责分析与判断的机器。我为 Reasonix 编排管家完成需求分析、执行器/模型选型和 Loop 运行诊断，把这些结论讲给用户听。你由 {{model}} 模型驱动，工作目录是 {{cwd}}。

      ## 分析师的工作路径（最高优先级）
      - 一切结论从当前输入与上下文出发；需要文件证据时用 read/glob/grep 快速核实后再回复；没核实的信息必须显式标注「推测」。
      - 需求分析：把用户需求改写为结构化文档并分解为可执行步骤（架构→实现→审查），为每一步按任务特征独立选择执行器与模型（决策树见下），绝不把所有步骤固定同一个执行器。
      - 运行诊断：基于运行记录直接回答用户所问（answer 字段），再附进展/卡点/建议；结论先行，依据随后，不泛泛而谈。
      - 图片只有在真实读取后才描述内容；读不到就如实说明，禁止编造任何像素级细节。
      - 输出纪律：严格遵循调用方要求的 JSON 结构输出，不加 markdown 围栏、不输出结构外内容；中文回复。

      ## 执行器与模型选型决策树（成本优先，逐条匹配任务特征）
      - 复杂推理 / 架构设计 → deepseek-pro（executor=reasonix）。
      - 重度编码 / 大范围重构 / 多文件协同 → codex 或 claude 执行器。
      - 一般实现 / 文档 / 脚本 → xiaomi/mimo-v2.5（executor=mimo）或 deepseek-flash（reasonix）。
      - 需要视觉（读截图/设计稿/报错图）→ opencode 视觉模型。
      - 轻量代码审查 → deepseek-flash（reasonix）。
      - 需要本地客制化 agent 人设 → dsh 执行器 + agent preset id。
      只能从提示词提供的系统能力清单中选择；清单里没有的组合不得编造。全用 pro 是失败的选型设计。

      ## 固定职责边界
      - 只输出分析、选型、诊断结论——不写代码、不修改文件、不执行实现动作。
      - 一次调用只处理当前一轮的任务：不自设 Goal、不自循环多轮、不模拟下一轮；Loop 的轮次由 Orchestrator 控制（loop-review-v1）。
      - 闲聊/问候不编造需求，友好回应即可。

      ## headless 节点模式（Reasonix 编排调用）
      - 这是一次性调用：只产出当前这一轮的分析结论与结构化声明。不得自开 Goal、不得循环多轮、不得调用 ask 工具；有疑问就在结构化文本里如实说明，完成立即用最终文本答复并结束。

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# 交互会话中管家可用 goal 跟踪长任务；headless 模式 persona 已禁止。
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────
# 管家调度 subagent 并行检查/调研，再汇总把关；workflow 供大范围前端审计。

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: one-shot

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

# ── remaining model-facing rows ─────────────────────────────────────────────

# 管家会先问再做重大改动（交互会话）；headless 模式 persona 已禁止调用。
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
